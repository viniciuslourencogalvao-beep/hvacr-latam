name: Atualizar radar HVACR

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'   # segunda 11:00 BRT
    - cron: '0 20 * * 1'   # segunda 17:00 BRT

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar HTML no Cloudflare D1
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          D1_DATABASE_ID: cec34320-05ca-4114-8f16-df62ac942cec
        run: |
          curl -sS --fail-with-body -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"sql":"SELECT html FROM radar WHERE id=1"}' \
            -o response.json

          jq -e '.success == true' response.json > /dev/null
          jq -r '.result[0].results[0].html' response.json > new_index.html

          head -c 15 new_index.html | grep -q '<!DOCTYPE html>' || { echo "HTML invalido (inicio)"; exit 1; }
          tail -c 20 new_index.html | grep -q '</html>' || { echo "HTML invalido (fim)"; exit 1; }
          mv new_index.html index.html
          rm -f response.json

      - name: Commit se houve mudança
        run: |
          if git diff --quiet -- index.html; then
            echo "Sem mudanças."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Atualiza radar HVACR LATAM"
          git push
