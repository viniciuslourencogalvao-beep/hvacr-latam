<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVACR LATAM — Radar Semanal</title>
<style>
  :root { color-scheme: light; --bg:#f4f6f9;--card:#ffffff;--header-bg:#0d1b2a;--header-accent:#1e88e5;--text:#1a1a2e;--text-muted:#6b7280;--border:#e5e7eb;--badge-market:#1e88e5;--badge-reg:#43a047;--badge-brand:#e53935;--badge-event:#fb8c00;--tag-bg-market:#e3f2fd;--tag-bg-reg:#e8f5e9;--tag-bg-brand:#ffebee;--tag-bg-event:#fff3e0;--shadow:0 1px 4px rgba(0,0,0,0.08);--warn:#92400e;--warn-bg:#fef3c7; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--header-bg);color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;flex-direction:column;gap:4px}
  .header-title{font-size:1.25rem;font-weight:700}
  .header-sub{font-size:0.78rem;color:#90caf9}
  .header-meta{font-size:0.72rem;color:#78909c;margin-top:2px}
  .lang-switcher{display:flex;gap:6px}
  .lang-btn{background:transparent;border:1.5px solid #455a64;color:#90caf9;padding:5px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .lang-btn.active{background:var(--header-accent);border-color:var(--header-accent);color:#fff}
  .toolbar{padding:16px 28px 0;display:flex;gap:8px;flex-wrap:wrap}
  .filter-btn{background:var(--card);border:1.5px solid var(--border);color:var(--text-muted);padding:5px 16px;border-radius:20px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .filter-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
  .period-heading{grid-column:1/-1;font-size:0.82rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;padding:18px 4px 2px;border-bottom:2px solid var(--border)}
  .period-heading:first-child{padding-top:4px}
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px 28px 32px}
  .news-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow 0.15s,transform 0.15s}
  .news-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.12);transform:translateY(-2px)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
  .badge-market{background:var(--tag-bg-market);color:var(--badge-market)}
  .badge-reg{background:var(--tag-bg-reg);color:var(--badge-reg)}
  .badge-brand{background:var(--tag-bg-brand);color:var(--badge-brand)}
  .badge-event{background:var(--tag-bg-event);color:var(--badge-event)}
  .card-num{font-size:0.7rem;font-weight:700;color:#d1d5db}
  .card-title{font-size:0.95rem;font-weight:700;line-height:1.35;color:var(--text)}
  .card-body{font-size:0.82rem;color:var(--text-muted);line-height:1.6}
  .card-date{font-size:0.68rem;color:#9ca3af;font-weight:600}
  .card-warn{font-size:0.68rem;color:var(--warn);font-weight:700;background:var(--warn-bg);display:inline-block;padding:2px 8px;border-radius:8px}
  .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
  .card-source{font-size:0.7rem;color:#9ca3af;font-style:italic}
  .card-link{font-size:0.7rem;color:var(--header-accent);text-decoration:none;font-weight:600}
  .count-bar{padding:8px 28px 0;font-size:0.75rem;color:var(--text-muted)}
  .count-bar span{font-weight:700;color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="header-title">📡 HVACR LATAM — Radar Semanal</div>
    <div class="header-sub" id="header-sub"></div>
    <div class="header-meta" id="header-meta"></div>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
  </div>
</header>
<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all')" id="btn-all"></button>
  <button class="filter-btn" onclick="setFilter('event')" id="btn-event"></button>
  <button class="filter-btn" onclick="setFilter('market')" id="btn-market"></button>
  <button class="filter-btn" onclick="setFilter('reg')" id="btn-reg"></button>
  <button class="filter-btn" onclick="setFilter('brand')" id="btn-brand"></button>
</div>
<div class="count-bar" id="count-bar"></div>
<div class="news-grid" id="grid"></div>
<script>
const news = [{"cat": "market", "date": "2026-10-09", "period": "week", "pt": {"title": "Exportações brasileiras aos EUA reagem em setembro (+31,9%), mas acumulam queda de 6,5% sob tarifas de 25%–37,5%", "body": "Segundo o monitor Brasil–EUA da Amcham, as exportações aos EUA somaram US$ 3,5 bi em setembro (+31,9% a/a, com preços médios +28%). No acumulado jan–set, recuo de 6,5% (US$ 27,5 bi); produtos sujeitos às tarifas de 25%–37,5% caíram 25,4%. Relevante para custos de insumos e cadeia industrial, incl. HVAC-R. Sem menção específica ao setor de climatização."}, "en": {"title": "Brazilian exports to the US rebound in September (+31.9%) but remain down 6.5% YTD under 25%–37.5% tariffs", "body": "Amcham's Brazil–US monitor shows exports to the US at US$3.5bn in September (+31.9% y/y, average prices +28%). Jan–Sep exports fell 6.5% (US$27.5bn); goods facing the 25%–37.5% tariffs dropped 25.4%. Relevant to input costs and the industrial chain, incl. HVAC-R. No sector-specific HVAC-R mention."}, "es": {"title": "Exportaciones brasileñas a EE.UU. repuntan en septiembre (+31,9%) pero acumulan caída de 6,5% bajo aranceles de 25%–37,5%", "body": "El monitor Brasil–EE.UU. de Amcham muestra exportaciones por US$ 3.500 M en septiembre (+31,9% interanual, precios +28%). En ene–sep caen 6,5% (US$ 27.500 M); los bienes con aranceles de 25%–37,5% bajaron 25,4%. Relevante para costos de insumos y cadena industrial, incl. HVAC-R. Sin mención específica al sector."}, "source": "Brasil Inovador / Amcham Brasil", "url": "https://brasilinovador.com.br/exportacoes-brasileiras-para-os-estados-unidos-reagem-em-setembro-mas-acumulam-retracao-sob-peso-de-tarifas/"}, {"cat": "reg", "date": "2026-10-06", "period": "week", "pt": {"title": "Resolução GECEX 973/2026: novos ex-tarifários de bens de capital — NÃO atinge o NCM 8414.30.19", "body": "Publicada no DOU em 07/10, a Resolução altera as Res. 780 e 781/2025 (ex-tarifários provisórios de BK e BIT): prorroga um item e inclui seis BK (ex.: empilhadeiras automáticas, carregadeiras de mineração, máquinas de costura, subestações SF6) e três itens de semicondutores. O único item do 84.14 é o NCM 8414.59.10 (microventiladores). Não há compressores; o NCM 8414.30.19 não é afetado (contexto: Res. 852/2026 elevou alíquotas de BK em fev/2026)."}, "en": {"title": "GECEX Resolution 973/2026: new capital-goods ex-tariffs — does NOT cover NCM 8414.30.19", "body": "Published in the DOU on Oct 7, it amends Res. 780 and 781/2025 (provisional ex-tariffs for capital and IT goods): extends one item and adds six capital goods (e.g., automated stacker cranes, mining loaders, sewing machines, SF6 substations) plus three semiconductor items. The only 84.14 item is NCM 8414.59.10 (micro fans). No compressors; NCM 8414.30.19 is not affected (context: Res. 852/2026 raised capital-goods rates in Feb 2026)."}, "es": {"title": "Resolución GECEX 973/2026: nuevos ex-arancelarios de bienes de capital — NO alcanza la NCM 8414.30.19", "body": "Publicada en el DOU el 7/10, modifica las Res. 780 y 781/2025 (ex-arancelarios provisorios de BK y BIT): prorroga un ítem e incluye seis BK (p. ej., apiladoras automáticas, cargadoras mineras, máquinas de coser, subestaciones SF6) y tres ítems de semiconductores. El único ítem del 84.14 es la NCM 8414.59.10 (microventiladores). Sin compresores; la NCM 8414.30.19 no se ve afectada (contexto: la Res. 852/2026 elevó alícuotas de BK en feb/2026)."}, "source": "Efficienza / DOU", "url": "https://efficienza.com.br/resolucao-gecex-no-973-de-6-de-outubro-de-2026/"}, {"cat": "brand", "date": "2026-10-08", "period": "week", "pt": {"title": "LG leva soluções com IA à estreia da FEBRAVA Rio 2026", "body": "A LG (que se diz líder em ar-condicionado na América Latina há 11 anos) ocupou estande de 200 m² na 1ª FEBRAVA Rio (6–8/10, Riocentro) com linhas residenciais e comerciais conectadas, além de demonstrações e treinamentos para instaladores (RoadShow LG 2026, Esquadrão LG)."}, "en": {"title": "LG brings AI-enabled solutions to the debut of FEBRAVA Rio 2026", "body": "LG (claiming 11 straight years as Latin America's top-selling AC brand) took a 200 m² booth at the first FEBRAVA Rio (Oct 6–8, Riocentro) with connected residential and commercial lines, plus demos and installer training (RoadShow LG 2026, Esquadrão LG)."}, "es": {"title": "LG presenta soluciones con IA en el debut de FEBRAVA Rio 2026", "body": "LG (que se dice líder en aire acondicionado en Latinoamérica por 11 años seguidos) tuvo un stand de 200 m² en la 1ª FEBRAVA Rio (6–8/10, Riocentro) con líneas residenciales y comerciales conectadas, además de demostraciones y capacitación para instaladores (RoadShow LG 2026, Esquadrão LG)."}, "source": "PR Newswire Brasil / LG", "url": "https://www.prnewswire.com/br/comunicados-para-a-imprensa/lg-reforca-pioneirismo-em-climatizacao-e-apresenta-solucoes-inteligentes-na-febrava-rio-2026-302902564.html"}, {"cat": "brand", "date": "2026-10-07", "period": "week", "pt": {"title": "TCL lança cassete 1 via ultrafino de 13 cm na FEBRAVA Rio", "body": "A TCL apresentou o Cassete 1 Via AI, equipamento de teto com apenas 13 cm de altura, comando de voz offline, atualização de firmware via Wi-Fi, IA para economia de energia e tecnologia Sky Flow, voltado a forros rebaixados com pouco espaço."}, "en": {"title": "TCL launches 13 cm ultra-slim one-way cassette at FEBRAVA Rio", "body": "TCL unveiled the Cassete 1 Via AI, a ceiling unit just 13 cm tall with offline voice control, Wi-Fi firmware updates, AI-based energy saving and Sky Flow airflow, aimed at low-clearance false ceilings."}, "es": {"title": "TCL lanza cassette de 1 vía ultradelgado de 13 cm en FEBRAVA Rio", "body": "TCL presentó el Cassete 1 Via AI, equipo de techo de solo 13 cm de alto, con control por voz sin conexión, actualización de firmware por Wi-Fi, IA para ahorro de energía y tecnología Sky Flow, pensado para cielos rasos con poco espacio."}, "source": "Brasil em Folhas", "url": "https://www.brasilemfolhas.com.br/2026/10/tcl-lanca-ar-condicionado-ultrafino-de-13-cm-na-febrava-rio/"}, {"cat": "brand", "date": "2026-10-05", "period": "week", "pt": {"title": "Gree leva lançamentos e treinamentos à estreia da FEBRAVA Rio", "body": "A Gree do Brasil expôs em estande de 200 m² linhas como Smartwind, G-Side Auto Inverter, novo G-Diamond, GMV Mini e GMV 9 Slim-M, com treinamentos de até 30 pessoas por turma, como parte de sua expansão no Sudeste."}, "en": {"title": "Gree brings launches and training to the FEBRAVA Rio debut", "body": "Gree do Brasil showed lines such as Smartwind, G-Side Auto Inverter, the new G-Diamond, GMV Mini and GMV 9 Slim-M in a 200 m² booth, with training classes of up to 30 people, as part of its Southeast expansion."}, "es": {"title": "Gree presenta lanzamientos y capacitaciones en el debut de FEBRAVA Rio", "body": "Gree do Brasil exhibió líneas como Smartwind, G-Side Auto Inverter, el nuevo G-Diamond, GMV Mini y GMV 9 Slim-M en un stand de 200 m², con capacitaciones de hasta 30 personas por grupo, como parte de su expansión en el Sudeste."}, "source": "Revista do Frio", "url": "https://revistadofrio.com.br/gree-lancamentos-treinamentos-febrava-rio-2026/"}, {"cat": "market", "date": "2026-09-30", "period": "month", "pt": {"title": "FEBRAVA Rio estreia (6–8/10) e Abrava projeta setor de R$ 55,62 bi em 2026", "body": "Organizada pela RX no Riocentro, a 1ª edição carioca esperava mais de 100 marcas e 10 mil visitantes, com foco em automação, IA e eficiência energética. A Abrava projeta faturamento de R$ 55,62 bi do setor HVAC-R em 2026 (vs. R$ 50,15 bi estimados em 2025)."}, "en": {"title": "FEBRAVA Rio debuts (Oct 6–8) as Abrava projects R$55.62bn sector in 2026", "body": "Organized by RX at Riocentro, the first Rio edition expected 100+ brands and 10,000 visitors, focused on automation, AI and energy efficiency. Abrava projects HVAC-R revenue of R$55.62bn in 2026 (vs. an estimated R$50.15bn in 2025)."}, "es": {"title": "FEBRAVA Rio debuta (6–8/10) y Abrava proyecta un sector de R$ 55,62 mil M en 2026", "body": "Organizada por RX en Riocentro, la primera edición carioca esperaba más de 100 marcas y 10.000 visitantes, con foco en automatización, IA y eficiencia energética. Abrava proyecta ingresos de R$ 55.620 M para el sector HVAC-R en 2026 (vs. R$ 50.150 M estimados en 2025)."}, "source": "Revista do Frio", "url": "https://revistadofrio.com.br/febrava-rio-2026-inovacao-eficiencia-energetica-hvac-r/"}, {"cat": "event", "date": "2026-09-08", "period": "lastmonth", "pt": {"title": "Prévia da FEBRAVA Rio: marcas anunciam novidades para a 1ª edição", "body": "Expositores como Elgin (condensadora vertical), Friven (100+ novidades), Johnson Controls (bomba de calor ar-água Ymae), Multivac, Armacell, Gree, Sicflux e Full Gauge anunciaram produtos; eventos paralelos incluem ENPC e encontro de mulheres do setor."}, "en": {"title": "FEBRAVA Rio preview: brands announce novelties for the first edition", "body": "Exhibitors such as Elgin (vertical condensing unit), Friven (100+ novelties), Johnson Controls (Ymae air-to-water heat pump), Multivac, Armacell, Gree, Sicflux and Full Gauge announced products; parallel events include ENPC and a women-in-HVAC meeting."}, "es": {"title": "Avance de FEBRAVA Rio: marcas anuncian novedades para la 1ª edición", "body": "Expositores como Elgin (condensadora vertical), Friven (100+ novedades), Johnson Controls (bomba de calor aire-agua Ymae), Multivac, Armacell, Gree, Sicflux y Full Gauge anunciaron productos; entre los eventos paralelos están ENPC y un encuentro de mujeres del sector."}, "source": "Portal Engenharia e Arquitetura", "url": "https://www.engenhariaearquitetura.com.br/2026/09/em-sua-primeira-edicao-febrava-rio-reune-algumas-das-principais-marcas"}, {"cat": "event", "date": "2026-09-03", "period": "lastmonth", "pt": {"title": "CIR 26: congresso virtual debate refrigerantes de baixo impacto e eficiência", "body": "O 7º Congresso Internacional de Refrigeração (1–2/09, virtual) discutiu digitalização, refrigerantes de menor impacto, eficiência e capacitação. Conclusão: não há resposta única para a transição de refrigerantes; depende da aplicação, custo e viabilidade de retrofit."}, "en": {"title": "CIR 26: virtual congress debates low-impact refrigerants and efficiency", "body": "The 7th International Refrigeration Congress (Sep 1–2, virtual) covered digitalization, lower-impact refrigerants, efficiency and training. Takeaway: no single answer for the refrigerant transition; it depends on application, cost and retrofit viability."}, "es": {"title": "CIR 26: congreso virtual debate refrigerantes de bajo impacto y eficiencia", "body": "El 7.º Congreso Internacional de Refrigeración (1–2/09, virtual) abordó digitalización, refrigerantes de menor impacto, eficiencia y capacitación. Conclusión: no hay una respuesta única para la transición de refrigerantes; depende de la aplicación, el costo y la viabilidad del retrofit."}, "source": "Mundo HVAC&R", "url": "https://www.mundohvacr.com/2026/09/la-proxima-decada-de-la-refrigeracion-ya-comenzo/"}, {"cat": "reg", "date": "2026-08-27", "period": "lastmonth", "pt": {"title": "Gecex (240ª reunião) inclui 553 BK/BIT na lista de ex-tarifários — compressores não mencionados", "body": "Em 27/08, o Gecex ampliou a lista de ex-tarifários de bens de capital e de informática/telecom (553 itens), renovou por 12 meses a alta tarifária de 28 químicos e aprovou medidas antidumping (resina PET, tubos de aço). A divulgação oficial não cita compressores nem o NCM 8414; a lista completa não foi verificada — o NCM 8414.30.19 não aparece como atingido."}, "en": {"title": "Gecex (240th meeting) adds 553 capital/IT goods to ex-tariff list — compressors not mentioned", "body": "On Aug 27, Gecex expanded the ex-tariff list for capital and IT/telecom goods (553 items), renewed higher tariffs on 28 chemicals for 12 months and approved antidumping measures (PET resin, steel tubes). The official release does not mention compressors or NCM 8414; the full list was not verified — NCM 8414.30.19 is not shown as affected."}, "es": {"title": "Gecex (240.ª reunión) incluye 553 BK/BIT en la lista de ex-arancelarios — compresores no mencionados", "body": "El 27/08, Gecex amplió la lista de ex-arancelarios de bienes de capital e informática/telecom (553 ítems), renovó por 12 meses el alza arancelaria de 28 químicos y aprobó medidas antidumping (resina PET, tubos de acero). El comunicado oficial no menciona compresores ni la NCM 8414; no se verificó la lista completa — la NCM 8414.30.19 no figura como afectada."}, "source": "MDIC / Camex", "url": "https://www.gov.br/mdic/pt-br/assuntos/noticias/2026-periodo-eleitoral/agosto/gecex-delibera-sobre-alteracoes-tarifarias-e-defesa-comercial"}, {"cat": "reg", "date": "2026-08-14", "period": "lastmonth", "pt": {"title": "A transição para A2L/A3 muda também a instalação, não só o fluido", "body": "Artigo da Mundo HVAC&R (Kigali) destaca que refrigerantes de baixo GWP exigem repensar projeto, carga máxima, ventilação, sensores de vazamento e componentes certificados, além de treinamento e procedimentos rigorosos de vácuo, carga e recuperação."}, "en": {"title": "A2L/A3 transition changes installation, not just the fluid", "body": "A Mundo HVAC&R article (Kigali) stresses that low-GWP refrigerants require rethinking design, maximum charge, ventilation, leak sensors and certified components, plus training and strict vacuum, charging and recovery procedures."}, "es": {"title": "La transición a A2L/A3 cambia también la instalación, no solo el fluido", "body": "Un artículo de Mundo HVAC&R (Kigali) destaca que los refrigerantes de bajo PCG exigen repensar diseño, carga máxima, ventilación, sensores de fugas y componentes certificados, además de capacitación y procedimientos estrictos de vacío, carga y recuperación."}, "source": "Mundo HVAC&R", "url": "https://www.mundohvacr.com/2026/08/la-instalacion-tambien-esta-cambiando/"}];

const i18n={pt:{sub:'Principais notícias do mercado de climatização e refrigeração na América Latina',meta:'Semana de 12–16 de outubro de 2026 · Atualizado em: 12/10/2026',all:'Todas',event:'🎪 Feiras & Eventos',market:'📈 Mercado',reg:'📋 Regulação',brand:'🏭 Fabricantes',showing:'Exibindo',news:'notícias',labels:{event:'Feira/Evento',market:'Mercado',reg:'Regulação',brand:'Fabricante'},periods:{week:'📅 Semana Passada',month:'🗓️ Este Mês',lastmonth:'📆 Mês Passado',context:'⚠️ Conteúdo Relevante (Data Não Confirmada)'},dateUnknown:'⚠️ Data não confirmada',source:'Fonte',readMore:'Leia mais →'},en:{sub:'Top news from the HVACR market in Latin America',meta:'Week of October 12–16, 2026 · Updated: 10/12/2026',all:'All',event:'🎪 Trade Shows',market:'📈 Market',reg:'📋 Regulation',brand:'🏭 Manufacturers',showing:'Showing',news:'news items',labels:{event:'Event',market:'Market',reg:'Regulation',brand:'Manufacturer'},periods:{week:'📅 Last Week',month:'🗓️ This Month',lastmonth:'📆 Last Month',context:'⚠️ Relevant Content (Date Not Confirmed)'},dateUnknown:'⚠️ Date not confirmed',source:'Source',readMore:'Read more →'},es:{sub:'Principales noticias del mercado HVACR en América Latina',meta:'Semana del 12 al 16 de octubre de 2026 · Actualizado: 12/10/2026',all:'Todas',event:'🎪 Ferias & Eventos',market:'📈 Mercado',reg:'📋 Regulación',brand:'🏭 Fabricantes',showing:'Mostrando',news:'noticias',labels:{event:'Feria/Evento',market:'Mercado',reg:'Regulación',brand:'Fabricante'},periods:{week:'📅 Semana Pasada',month:'🗓️ Este Mes',lastmonth:'📆 Mes Pasado',context:'⚠️ Contenido Relevante (Fecha No Confirmada)'},dateUnknown:'⚠️ Fecha no confirmada',source:'Fuente',readMore:'Leer más →'}};
const periodOrder=['week','month','lastmonth','context'];
let currentLang='pt',activeFilter='all';
function setLang(l){currentLang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));const t=i18n[l];document.getElementById('header-sub').textContent=t.sub;document.getElementById('header-meta').textContent=t.meta;document.getElementById('btn-all').textContent=t.all;document.getElementById('btn-event').textContent=t.event;document.getElementById('btn-market').textContent=t.market;document.getElementById('btn-reg').textContent=t.reg;document.getElementById('btn-brand').textContent=t.brand;renderGrid()}
function setFilter(f){activeFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+f).classList.add('active');renderGrid()}
function renderGrid(){
  const t=i18n[currentLang];
  const filtered=(activeFilter==='all'?news:news.filter(n=>n.cat===activeFilter)).slice().sort((a,b)=>{
    if(a.period==='context'&&b.period!=='context') return 1;
    if(b.period==='context'&&a.period!=='context') return -1;
    if(a.period==='context'&&b.period==='context') return 0;
    return new Date(b.date)-new Date(a.date);
  });
  document.getElementById('count-bar').innerHTML=`<span>${filtered.length}</span> ${t.news}`;
  let html='';
  let counter=0;
  periodOrder.forEach(p=>{
    const group=filtered.filter(n=>n.period===p);
    if(group.length===0) return;
    html+=`<div class="period-heading">${t.periods[p]}</div>`;
    group.forEach(n=>{
      counter++;
      const d=n[currentLang];
      const dateHtml = n.period==='context' ? `<span class="card-warn">${t.dateUnknown}</span>` : `<div class="card-date">${n.date}</div>`;
      html+=`<div class="news-card"><div class="card-top"><span class="badge badge-${n.cat}">${t.labels[n.cat]}</span><span class="card-num">#${counter}</span></div><div class="card-title">${d.title}</div><div class="card-body">${d.body}</div>${dateHtml}<div class="card-footer"><span class="card-source">${t.source}: ${n.source}</span><a class="card-link" href="${n.url}" target="_blank">${t.readMore}</a></div></div>`;
    });
  });
  document.getElementById('grid').innerHTML=html;
