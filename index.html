<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVACR LATAM — Radar Semanal</title>
<style>
  :root { color-scheme: light; --bg:#f4f6f9;--card:#ffffff;--header-bg:#0d1b2a;--header-accent:#1e88e5;--text:#1a1a2e;--text-muted:#6b7280;--border:#e5e7eb;--badge-market:#1e88e5;--badge-reg:#43a047;--badge-brand:#e53935;--badge-event:#fb8c00;--tag-bg-market:#e3f2fd;--tag-bg-reg:#e8f5e9;--tag-bg-brand:#ffebee;--tag-bg-event:#fff3e0;--shadow:0 1px 4px rgba(0,0,0,0.08);--warn:#92400e;--warn-bg:#fef3c7; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--header-bg);color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;flex-direction:column;gap:4px}
  .header-title{font-size:1.25rem;font-weight:700}
  .header-sub{font-size:0.78rem;color:#90caf9}
  .header-meta{font-size:0.72rem;color:#78909c;margin-top:2px}
  .lang-switcher{display:flex;gap:6px}
  .lang-btn{background:transparent;border:1.5px solid #455a64;color:#90caf9;padding:5px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .lang-btn.active{background:var(--header-accent);border-color:var(--header-accent);color:#fff}
  .toolbar{padding:16px 28px 0;display:flex;gap:8px;flex-wrap:wrap}
  .filter-btn{background:var(--card);border:1.5px solid var(--border);color:var(--text-muted);padding:5px 16px;border-radius:20px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .filter-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
  .period-heading{grid-column:1/-1;font-size:0.82rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;padding:18px 4px 2px;border-bottom:2px solid var(--border)}
  .period-heading:first-child{padding-top:4px}
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px 28px 32px}
  .news-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow 0.15s,transform 0.15s}
  .news-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.12);transform:translateY(-2px)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
  .badge-market{background:var(--tag-bg-market);color:var(--badge-market)}
  .badge-reg{background:var(--tag-bg-reg);color:var(--badge-reg)}
  .badge-brand{background:var(--tag-bg-brand);color:var(--badge-brand)}
  .badge-event{background:var(--tag-bg-event);color:var(--badge-event)}
  .card-num{font-size:0.7rem;font-weight:700;color:#d1d5db}
  .card-title{font-size:0.95rem;font-weight:700;line-height:1.35;color:var(--text)}
  .card-body{font-size:0.82rem;color:var(--text-muted);line-height:1.6}
  .card-date{font-size:0.68rem;color:#9ca3af;font-weight:600}
  .card-warn{font-size:0.68rem;color:var(--warn);font-weight:700;background:var(--warn-bg);display:inline-block;padding:2px 8px;border-radius:8px}
  .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
  .card-source{font-size:0.7rem;color:#9ca3af;font-style:italic}
  .card-link{font-size:0.7rem;color:var(--header-accent);text-decoration:none;font-weight:600}
  .count-bar{padding:8px 28px 0;font-size:0.75rem;color:var(--text-muted)}
  .count-bar span{font-weight:700;color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="header-title">📡 HVACR LATAM — Radar Semanal</div>
    <div class="header-sub" id="header-sub"></div>
    <div class="header-meta" id="header-meta"></div>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
  </div>
</header>
<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all')" id="btn-all"></button>
  <button class="filter-btn" onclick="setFilter('event')" id="btn-event"></button>
  <button class="filter-btn" onclick="setFilter('market')" id="btn-market"></button>
  <button class="filter-btn" onclick="setFilter('reg')" id="btn-reg"></button>
  <button class="filter-btn" onclick="setFilter('brand')" id="btn-brand"></button>
</div>
<div class="count-bar" id="count-bar"></div>
<div class="news-grid" id="grid"></div>
<script>
// DADOS — notícias selecionadas (filtradas por recência <= 60 dias)
const news = [
  {
    cat: 'brand',
    date: '2026-07-24',
    period: 'week',
    pt: { title: 'Tecumseh anuncia investimento de R$ 130 milhões em São Carlos e Manaus', body: 'A fabricante de compressores Tecumseh anunciou aportes de R$ 130 milhões no Brasil — R$ 70 milhões na unidade de São Carlos (SP) e R$ 60 milhões no polo industrial de Manaus (AM), onde prevê abrir uma nova planta em 2028. A empresa, que hoje detém entre 15% e 20% do mercado brasileiro de compressores para refrigeração e climatização, projeta alcançar 30% de participação. O movimento reforça a produção local de compressores (NCM 8414.30), item sensível para importadores desde a elevação das alíquotas de bens de capital pela Resolução Gecex 852/2026.' },
    en: { title: 'Tecumseh announces R$130 million investment in São Carlos and Manaus', body: 'Compressor manufacturer Tecumseh announced R$130 million in new investment in Brazil — R$70 million for its São Carlos (SP) plant and R$60 million for the Manaus (AM) industrial hub, where it plans a new facility by 2028. The company, which currently holds 15-20% of Brazil\'s refrigeration and AC compressor market, aims to reach 30% share. The move reinforces local compressor production (NCM 8414.30) as importers adjust to higher capital-goods import tariffs under Gecex Resolution 852/2026.' },
    es: { title: 'Tecumseh anuncia inversión de R$130 millones en São Carlos y Manaus', body: 'El fabricante de compresores Tecumseh anunció una inversión de R$130 millones en Brasil: R$70 millones para su planta de São Carlos (SP) y R$60 millones para el polo industrial de Manaus (AM), donde prevé abrir una nueva fábrica en 2028. La empresa, que hoy tiene entre 15% y 20% del mercado brasileño de compresores, proyecta alcanzar el 30% de participación. El movimiento refuerza la producción local de compresores (NCM 8414.30) mientras los importadores ajustan costos tras el alza de aranceles de la Resolución Gecex 852/2026.' },
    source: 'Revista do Frio',
    url: 'https://revistadofrio.com.br/tecumseh-investira-r-130-milhoes-em-sao-carlos-e-manaus/'
  },
  {
    cat: 'reg',
    date: '2026-07-02',
    period: 'month',
    pt: { title: 'Gecex altera lista de ex-tarifários de bens de capital', body: 'A Resolução Gecex nº 932, de 2 de julho de 2026, alterou o Anexo Único da Resolução Gecex nº 780/2025, excluindo e incluindo itens na lista de ex-tarifários de bens de capital (reduções temporárias do Imposto de Importação). A medida integra o mesmo arcabouço regulatório da Resolução Gecex 852/2026, que elevou alíquotas de importação de bens de capital — incluindo o NCM 8414.30.19, usado por importadores de compressores frigoríficos. Não há, até o momento, menção explícita a compressores no anexo da 932; o desdobramento segue em monitoramento.' },
    en: { title: 'Gecex amends Brazil\'s capital-goods tariff exemption list', body: 'Gecex Resolution No. 932, dated July 2, 2026, amended the Single Annex of Resolution 780/2025, excluding and adding items to Brazil\'s capital-goods "ex-tarifário" list (temporary import tax reductions). The measure sits within the same regulatory framework as Resolution 852/2026, which raised import tariffs on capital goods — including NCM 8414.30.19, used by importers of refrigeration compressors. No explicit mention of compressors was found in Resolution 932\'s annex; this remains under watch.' },
    es: { title: 'Gecex modifica la lista de ex-tarifarios de bienes de capital', body: 'La Resolución Gecex n.º 932, del 2 de julio de 2026, modificó el Anexo Único de la Resolución 780/2025, excluyendo e incluyendo ítems en la lista de "ex-tarifarios" de bienes de capital (reducciones temporales del impuesto de importación). La medida se enmarca en el mismo esquema regulatorio que la Resolución 852/2026, que elevó los aranceles de bienes de capital, incluyendo el NCM 8414.30.19 usado por importadores de compresores de refrigeración. No se identificó mención explícita a compresores en el anexo de la 932; el tema sigue en seguimiento.' },
    source: 'LegisWeb / Efficienza Comércio Internacional',
    url: 'https://www.legisweb.com.br/legislacao/?id=497653'
  },
  {
    cat: 'brand',
    date: '2026-07-16',
    period: 'month',
    pt: { title: 'Trane México celebra 35 anos e aposta em infraestrutura inteligente', body: 'A Trane México comemora 35 anos de operação no país (113 anos globalmente), destacando projetos em manufatura automotiva, saúde e aeroportos, além do avanço para eletrificação, digitalização e monitoramento remoto. A empresa aponta data centers e demanda por eficiência energética como vetores estratégicos para o HVAC na região.' },
    en: { title: 'Trane Mexico marks 35 years, doubles down on smart infrastructure', body: 'Trane Mexico marks 35 years of operations in the country (113 years globally), highlighting projects in automotive manufacturing, healthcare and airports, alongside a push toward electrification, digitalization and remote monitoring. The company points to data centers and energy-efficiency demand as strategic drivers for HVAC in the region.' },
    es: { title: 'Trane México celebra 35 años y apuesta por la infraestructura inteligente', body: 'Trane México celebra 35 años de operaciones en el país (113 a nivel global), destacando proyectos en manufactura automotriz, salud y aeropuertos, además de avances en electrificación, digitalización y monitoreo remoto. La empresa señala los centros de datos y la demanda de eficiencia energética como motores estratégicos para el HVAC en la región.' },
    source: 'ACR Latinoamérica',
    url: 'https://www.acrlatinoamerica.com/en/news/latest-news/348-enterprises/21190-trane-mexico-celebrates-35-years-driving-the-evolution-of-hvac-to-smart-infrastructure.html'
  },
  {
    cat: 'event',
    date: '2026-07-16',
    period: 'month',
    pt: { title: 'RefriAméricas 2026 acontece em 29 e 30 de julho na Flórida', body: 'O RefriAméricas 2026 reunirá profissionais da América Latina, Caribe, EUA e Europa no Broward County Convention Center, em Fort Lauderdale. Sob o tema "Eficiência, descarbonização e transformação tecnológica em HVAC/R", o programa acadêmico traz mais de 25 conferências técnicas, workshops e a cerimônia CALA AWARDS 2026.' },
    en: { title: 'RefriAméricas 2026 takes place July 29-30 in Florida', body: 'RefriAméricas 2026 will bring together professionals from Latin America, the Caribbean, the US and Europe at the Broward County Convention Center in Fort Lauderdale. Under the theme "Efficiency, decarbonization and technological transformation in HVAC/R," the academic program includes more than 25 technical conferences, workshops and the CALA AWARDS 2026 ceremony.' },
    es: { title: 'RefriAméricas 2026 se realiza el 29 y 30 de julio en Florida', body: 'RefriAméricas 2026 reunirá a profesionales de América Latina, el Caribe, EE. UU. y Europa en el Broward County Convention Center de Fort Lauderdale. Bajo el lema "Eficiencia, descarbonización y transformación tecnológica en HVAC/R", el programa académico incluye más de 25 conferencias técnicas, talleres y la ceremonia CALA AWARDS 2026.' },
    source: 'ACR Latinoamérica',
    url: 'https://www.acrlatinoamerica.com/en/news/latest-news/348-enterprises/21193-refriamericas-2026-will-bring-together-international-experts-to-drive-the-transformation-of-the-hvac-r-sector.html'
  },
  {
    cat: 'brand',
    date: '2026-06-23',
    period: 'lastmonth',
    pt: { title: 'Johnson Controls destaca cinco engenheiras na América Latina', body: 'Em celebração ao Dia Internacional das Mulheres na Engenharia, a Johnson Controls reconheceu cinco engenheiras latino-americanas atuantes em refrigeração industrial, automação, mineração e infraestrutura crítica, no Brasil, México, Colômbia, Chile e Costa Rica.' },
    en: { title: 'Johnson Controls highlights five women engineers in Latin America', body: 'To mark International Women in Engineering Day, Johnson Controls recognized five Latin American female engineers working in industrial refrigeration, automation, mining and critical infrastructure across Brazil, Mexico, Colombia, Chile and Costa Rica.' },
    es: { title: 'Johnson Controls destaca a cinco ingenieras en América Latina', body: 'Con motivo del Día Internacional de la Mujer en la Ingeniería, Johnson Controls reconoció a cinco ingenieras latinoamericanas que trabajan en refrigeración industrial, automatización, minería e infraestructura crítica en Brasil, México, Colombia, Chile y Costa Rica.' },
    source: 'ACR Latinoamérica',
    url: 'https://www.acrlatinoamerica.com/en/news/latest-news/348-enterprises/21187-johnson-controls-highlights-five-women-engineers-driving-innovation-in-latin-america.html'
  },
  {
    cat: 'reg',
    date: '2026-06-18',
    period: 'lastmonth',
    pt: { title: 'Chile avança em norma para regular emissões de HFC', body: 'O Ministério do Meio Ambiente do Chile segue com a elaboração participativa da futura Norma de Emissão de Hidrofluorcarbonos (HFC), iniciada pela Resolução Isenta nº 9.634/2025. A proposta prevê mecanismos de compensação via mercado de carbono e busca alinhar o setor de refrigeração e climatização às metas de neutralidade de carbono do país até 2050, no âmbito da Emenda de Kigali.' },
    en: { title: 'Chile advances standard to regulate HFC emissions', body: 'Chile\'s Ministry of the Environment continues the participatory drafting of its future Hydrofluorocarbon (HFC) Emission Standard, launched under Exempt Resolution No. 9,634/2025. The proposal includes carbon-market offset mechanisms and aims to align the refrigeration and air conditioning sector with the country\'s 2050 carbon-neutrality goals under the Kigali Amendment.' },
    es: { title: 'Chile avanza en norma para regular las emisiones de HFC', body: 'El Ministerio del Medio Ambiente de Chile continúa con la elaboración participativa de la futura Norma de Emisión de Hidrofluorocarburos (HFC), iniciada por la Resolución Exenta n.º 9.634/2025. La propuesta incluye mecanismos de compensación vía mercado de carbono y busca alinear al sector de refrigeración y climatización con la meta de neutralidad de carbono del país para 2050, en el marco de la Enmienda de Kigali.' },
    source: 'ACR Latinoamérica',
    url: 'https://www.acrlatinoamerica.com/en/news/latest-news/348-enterprises/21182-chile-advances-in-the-development-of-a-standard-to-regulate-hfc-emissions.html'
  },
  {
    cat: 'event',
    date: '2026-05-28',
    period: 'lastmonth',
    pt: { title: 'Jalisco se consolida como polo de inovação com a AHR Expo México 2026', body: 'Guadalajara se prepara para sediar a AHR Expo México 2026, de 29 de setembro a 1º de outubro, com mais de 440 expositores e expectativa de 13 mil profissionais — crescimento de até 100% em área de exposição frente à edição de 2022. O evento deve atrair novos compradores da região oeste do país, ainda pouco expostos às tecnologias do setor.' },
    en: { title: 'Jalisco positions itself as an innovation hub with AHR Expo Mexico 2026', body: 'Guadalajara is preparing to host AHR Expo Mexico 2026, from September 29 to October 1, with more than 440 exhibitors and roughly 13,000 professionals expected — up to 100% more exhibition space than the 2022 edition. The show is expected to draw new buyers from western Mexico who have had limited prior exposure to the sector\'s technologies.' },
    es: { title: 'Jalisco se consolida como polo de innovación con AHR Expo México 2026', body: 'Guadalajara se prepara para albergar AHR Expo México 2026, del 29 de septiembre al 1 de octubre, con más de 440 expositores y una asistencia estimada de 13 mil profesionales, hasta 100% más superficie de exposición que en la edición 2022. Se espera que el evento atraiga a nuevos compradores del occidente del país, con poca exposición previa a las tecnologías del sector.' },
    source: 'ACR Latinoamérica',
    url: 'https://www.acrlatinoamerica.com/novedades/ultimas-noticias/22-empresas/21146-jalisco-se-consolida-como-centro-de-innovacion-para-la-industria-hvacr-con-ahr-expo-mexico-2026.html'
  }
];

const i18n={pt:{sub:'Principais notícias do mercado de climatização e refrigeração na América Latina',meta:'Semana de 21–27 de julho de 2026 · Atualizado em: 27/07/2026',all:'Todas',event:'🎪 Feiras & Eventos',market:'📈 Mercado',reg:'📋 Regulação',brand:'🏭 Fabricantes',showing:'Exibindo',news:'notícias',labels:{event:'Feira/Evento',market:'Mercado',reg:'Regulação',brand:'Fabricante'},periods:{week:'📅 Semana Passada',month:'🗓️ Este Mês',lastmonth:'📆 Mês Passado',context:'⚠️ Conteúdo Relevante (Data Não Confirmada)'},dateUnknown:'⚠️ Data não confirmada',source:'Fonte',readMore:'Leia mais →'},en:{sub:'Top news from the HVACR market in Latin America',meta:'Week of July 21–27, 2026 · Updated: 07/27/2026',all:'All',event:'🎪 Trade Shows',market:'📈 Market',reg:'📋 Regulation',brand:'🏭 Manufacturers',showing:'Showing',news:'news items',labels:{event:'Event',market:'Market',reg:'Regulation',brand:'Manufacturer'},periods:{week:'📅 Last Week',month:'🗓️ This Month',lastmonth:'📆 Last Month',context:'⚠️ Relevant Content (Date Not Confirmed)'},dateUnknown:'⚠️ Date not confirmed',source:'Source',readMore:'Read more →'},es:{sub:'Principales noticias del mercado HVACR en América Latina',meta:'Semana del 21 al 27 de julio de 2026 · Actualizado: 27/07/2026',all:'Todas',event:'🎪 Ferias & Eventos',market:'📈 Mercado',reg:'📋 Regulación',brand:'🏭 Fabricantes',showing:'Mostrando',news:'noticias',labels:{event:'Feria/Evento',market:'Mercado',reg:'Regulación',brand:'Fabricante'},periods:{week:'📅 Semana Pasada',month:'🗓️ Este Mes',lastmonth:'📆 Mes Pasado',context:'⚠️ Contenido Relevante (Fecha No Confirmada)'},dateUnknown:'⚠️ Fecha no confirmada',source:'Fuente',readMore:'Leer más →'}};
const periodOrder=['week','month','lastmonth','context'];
let currentLang='pt',activeFilter='all';
function setLang(l){currentLang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));const t=i18n[l];document.getElementById('header-sub').textContent=t.sub;document.getElementById('header-meta').textContent=t.meta;document.getElementById('btn-all').textContent=t.all;document.getElementById('btn-event').textContent=t.event;document.getElementById('btn-market').textContent=t.market;document.getElementById('btn-reg').textContent=t.reg;document.getElementById('btn-brand').textContent=t.brand;renderGrid()}
function setFilter(f){activeFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+f).classList.add('active');renderGrid()}
function renderGrid(){
  const t=i18n[currentLang];
  const filtered=(activeFilter==='all'?news:news.filter(n=>n.cat===activeFilter)).slice().sort((a,b)=>{
    if(a.period==='context'&&b.period!=='context') return 1;
    if(b.period==='context'&&a.period!=='context') return -1;
    if(a.period==='context'&&b.period==='context') return 0;
    return new Date(b.date)-new Date(a.date);
  });
  document.getElementById('count-bar').innerHTML=`<span>${filtered.length}</span> ${t.news}`;
  let html='';
  let counter=0;
  periodOrder.forEach(p=>{
    const group=filtered.filter(n=>n.period===p);
    if(group.length===0) return;
    html+=`<div class="period-heading">${t.periods[p]}</div>`;
    group.forEach(n=>{
      counter++;
      const d=n[currentLang];
      const dateHtml = n.period==='context' ? `<span class="card-warn">${t.dateUnknown}</span>` : `<div class="card-date">${n.date}</div>`;
      html+=`<div class="news-card"><div class="card-top"><span class="badge badge-${n.cat}">${t.labels[n.cat]}</span><span class="card-num">#${counter}</span></div><div class="card-title">${d.title}</div><div class="card-body">${d.body}</div>${dateHtml}<div class="card-footer"><span class="card-source">${t.source}: ${n.source}</span><a class="card-link" href="${n.url}" target="_blank">${t.readMore}</a></div></div>`;
    });
  });
  document.getElementById('grid').innerHTML=html;
}
setLang('pt');
</script>
</body>
</html>
