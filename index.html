<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVACR LATAM — Radar Semanal</title>
<style>
  :root { color-scheme: light; --bg:#f4f6f9;--card:#ffffff;--header-bg:#0d1b2a;--header-accent:#1e88e5;--text:#1a1a2e;--text-muted:#6b7280;--border:#e5e7eb;--badge-market:#1e88e5;--badge-reg:#43a047;--badge-brand:#e53935;--badge-event:#fb8c00;--tag-bg-market:#e3f2fd;--tag-bg-reg:#e8f5e9;--tag-bg-brand:#ffebee;--tag-bg-event:#fff3e0;--shadow:0 1px 4px rgba(0,0,0,0.08);--warn:#92400e;--warn-bg:#fef3c7; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--header-bg);color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;flex-direction:column;gap:4px}
  .header-title{font-size:1.25rem;font-weight:700}
  .header-sub{font-size:0.78rem;color:#90caf9}
  .header-meta{font-size:0.72rem;color:#78909c;margin-top:2px}
  .lang-switcher{display:flex;gap:6px}
  .lang-btn{background:transparent;border:1.5px solid #455a64;color:#90caf9;padding:5px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .lang-btn.active{background:var(--header-accent);border-color:var(--header-accent);color:#fff}
  .toolbar{padding:16px 28px 0;display:flex;gap:8px;flex-wrap:wrap}
  .filter-btn{background:var(--card);border:1.5px solid var(--border);color:var(--text-muted);padding:5px 16px;border-radius:20px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .filter-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
  .period-heading{grid-column:1/-1;font-size:0.82rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;padding:18px 4px 2px;border-bottom:2px solid var(--border)}
  .period-heading:first-child{padding-top:4px}
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px 28px 32px}
  .news-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow 0.15s,transform 0.15s}
  .news-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.12);transform:translateY(-2px)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
  .badge-market{background:var(--tag-bg-market);color:var(--badge-market)}
  .badge-reg{background:var(--tag-bg-reg);color:var(--badge-reg)}
  .badge-brand{background:var(--tag-bg-brand);color:var(--badge-brand)}
  .badge-event{background:var(--tag-bg-event);color:var(--badge-event)}
  .card-num{font-size:0.7rem;font-weight:700;color:#d1d5db}
  .card-title{font-size:0.95rem;font-weight:700;line-height:1.35;color:var(--text)}
  .card-body{font-size:0.82rem;color:var(--text-muted);line-height:1.6}
  .card-date{font-size:0.68rem;color:#9ca3af;font-weight:600}
  .card-warn{font-size:0.68rem;color:var(--warn);font-weight:700;background:var(--warn-bg);display:inline-block;padding:2px 8px;border-radius:8px}
  .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
  .card-source{font-size:0.7rem;color:#9ca3af;font-style:italic}
  .card-link{font-size:0.7rem;color:var(--header-accent);text-decoration:none;font-weight:600}
  .count-bar{padding:8px 28px 0;font-size:0.75rem;color:var(--text-muted)}
  .count-bar span{font-weight:700;color:var(--text)}
</style>
</head>

<header>

    pt: { title: 'Tarifa adicional de 25% dos EUA amplia cautela na cadeia HVAC-R brasileira', body: 'A tarifa adicional de 25% dos EUA sobre produtos brasileiros, em vigor desde 22/07/2026, acrescenta incerteza ao planejamento do setor HVAC-R. Embora a exposição direta ao mercado americano seja limitada, o impacto ocorre via encarecimento de componentes importados e insumos como aço e alumínio. O Termômetro AVACR da ABRAVA já registra alta na inflação setorial (5,11% projetada) e queda na confiança empresarial. Empresas reforçam gestão de estoques, diversificação de fornecedores e buscam linhas de crédito do BNDES (Plano Brasil Soberano). A CNI propôs ao governo a criação de uma sétima missão da Nova Indústria Brasil (NIB), voltada aos setores afetados pela tarifa.' },
    en: { title: "Additional 25% U.S. tariff adds caution across Brazil's HVAC-R supply chain", body: "The additional 25% U.S. tariff on Brazilian goods, in effect since July 22, 2026, adds uncertainty to HVAC-R industry planning. While direct exposure to the U.S. market is limited, the impact comes through pricier imported components and inputs like steel and aluminum. ABRAVA's AVACR Thermometer already shows rising sector inflation (5.11% projected) and falling business confidence. Companies are reinforcing inventory management, diversifying suppliers and tapping BNDES credit lines (Plano Brasil Soberano). CNI proposed a seventh Nova Indústria Brasil (NIB) mission targeting sectors hit by the tariff." },
    es: { title: 'Arancel adicional del 25% de EE.UU. aumenta la cautela en la cadena HVAC-R de Brasil', body: 'El arancel adicional del 25% de EE.UU. sobre productos brasileños, vigente desde el 22/07/2026, añade incertidumbre a la planificación del sector HVAC-R. Aunque la exposición directa al mercado estadounidense es limitada, el impacto llega por el encarecimiento de componentes importados e insumos como acero y aluminio. El Termómetro AVACR de ABRAVA ya registra mayor inflación sectorial (5,11% proyectada) y caída en la confianza empresarial. Las empresas refuerzan la gestión de inventarios, diversifican proveedores y buscan líneas de crédito del BNDES (Plan Brasil Soberano). La CNI propuso al gobierno crear una séptima misión de la Nueva Industria Brasil (NIB) para los sectores afectados por el arancel.' },

  {

    date: '2026-08-04',

    pt: { title: 'GECEX concede novos ex-tarifários no capítulo 84.14, sem alcançar compressores de refrigeração', body: 'A Resolução GECEX nº 943, de 04/08/2026, alterou o Anexo da Resolução 780/2025 para conceder e ajustar ex-tarifários de bens de capital no capítulo 84.14 — bombas de vácuo, sopradores e compressores de ar industriais (NCMs 8414.10, 8414.59, 8414.80). A medida não atinge o NCM 8414.30.19 (compressores para equipamentos frigoríficos), que segue com a alíquota de 7,2% definida pela Resolução GECEX 852/2026. Não há, até o momento, novidades específicas sobre revisão dessa alíquota ou sobre a investigação antidumping de compressores recíprocos chineses (NCM 8414.30.11), aberta em abril de 2026.' },
    en: { title: 'GECEX grants new tariff exemptions under HS chapter 84.14, but not for refrigeration compressors', body: 'GECEX Resolution No. 943 (Aug 4, 2026) amended Resolution 780/2025 to grant and adjust capital-goods tariff exemptions (ex-tarifário) within HS chapter 84.14 — vacuum pumps, blowers and industrial air compressors (HS codes 8414.10, 8414.59, 8414.80). The measure does not reach HS code 8414.30.19 (refrigeration-type compressors), which remains at the 7.2% rate set by GECEX Resolution 852/2026. There is no update so far on a review of that rate or on the antidumping investigation into Chinese reciprocating compressors (HS 8414.30.11), opened in April 2026.' },

    es: { title: 'Mercofrio 2026 confirma ocupación total de sus espacios comerciales', body: "Mercofrio 2026, el 15º Congreso Internacional de Aire Acondicionado, Refrigeración, Calefacción y Ventilación, se realizará del 15 al 17 de septiembre en BarraShoppingSul, Porto Alegre, Brasil. La organizadora Asbrav confirmó el cierre de todas las cuotas de patrocinio, con marcas como Midea, Daikin, LG, Johnson Controls y Ziehl-Abegg confirmadas. El tema central es 'AVAC-R Inteligente: IA, Eficiencia y Calidad del Aire para un Planeta Sostenible'." },

    es: { title: 'Johnson Controls lanza el termostato TEC4000S con enfoque en accesibilidad', body: 'Johnson Controls presentó la serie de termostatos comerciales TEC4000S, con una interfaz de nivel AAA de accesibilidad (WCAG) y una reducción de hasta el 80% en el tiempo de configuración y puesta en marcha. El modelo está dirigido a aplicaciones de zona única de entre 28 y 280 m² — oficinas, hoteles, retail y escuelas — y es compatible con BACnet MS/TP.' },

  {

    date: '2026-08-08',

    pt: { title: 'El Niño mobiliza indústria de ar-condicionado no Brasil, mas juros altos limitam otimismo', body: 'Diante da perspectiva de um El Niño entre os mais fortes desde 1950, fabricantes reforçaram estoques e varejistas anteciparam encomendas. A Abrava projeta faturamento de R$ 55,62 bilhões em 2026 (alta de 10%) após os R$ 50,15 bilhões de 2025, mas destaca que a Selic em 14% e o endividamento das famílias seguem como entraves à demanda por bens duráveis. A produção de split cresceu de 3,816 milhões (2023) para 6,385 milhões de unidades (2025).' },
    en: { title: "El Niño mobilizes Brazil's air conditioning industry, but high interest rates temper optimism", body: "Facing one of the strongest El Niño events since 1950, manufacturers have built up inventory and retailers have front-loaded orders. ABRAVA projects 2026 revenue of R$55.62 billion (up 10%) after R$50.15 billion in 2025, but flags Brazil's 14% Selic rate and household debt as ongoing drags on durable-goods demand. Split air conditioner production grew from 3.816 million units (2023) to 6.385 million (2025)." },
    es: { title: 'El Niño moviliza a la industria del aire acondicionado en Brasil, pero las altas tasas limitan el optimismo', body: 'Ante la perspectiva de uno de los El Niño más fuertes desde 1950, los fabricantes reforzaron inventarios y los minoristas adelantaron pedidos. ABRAVA proyecta una facturación de R$ 55.620 millones en 2026 (alza del 10%) tras los R$ 50.150 millones de 2025, pero señala que la tasa Selic del 14% y el endeudamiento de las familias siguen frenando la demanda de bienes duraderos. La producción de equipos split pasó de 3,816 millones (2023) a 6,385 millones de unidades (2025).' },
    source: 'ES Hoje (FolhaPress)',
    url: 'https://eshoje.com.br/economia/2026/08/el-nino-mobiliza-industria-de-ar-condicionado-que-receia-efeitos-de-juros-altos-e-endividamento/'
  },
  {
    cat: 'event',
    date: '2026-08-14',
    period: 'month',
    pt: { title: 'Começa a contagem regressiva para a AHR Expo México 2026, em Guadalajara', body: 'A menos de 100 dias do evento, a AHR Expo México 2026 se prepara para reunir mais de 440 expositores e 13 mil profissionais entre 29 de setembro e 1º de outubro, na Expo Guadalajara. A edição destaca soluções de eficiência energética, automação, climatização, refrigeração e qualidade do ar, com impacto esperado em manufatura, construção, hotelaria, varejo, cadeia do frio, saúde e data centers.' },
    en: { title: 'Countdown begins for AHR Expo Mexico 2026 in Guadalajara', body: 'With less than 100 days to go, AHR Expo Mexico 2026 is preparing to bring together more than 440 exhibitors and 13,000 professionals from September 29 to October 1 at Expo Guadalajara. This edition highlights energy efficiency, automation, air conditioning, refrigeration and air quality solutions, with expected impact on manufacturing, construction, hospitality, retail, cold chain, healthcare and data centers.' },

    es: { title: 'Febrava RIO estrena programación dirigida a mercados consumidores de HVAC-R', body: 'La primera edición de Febrava RIO incluirá Febrava CONVERGE, del 6 al 8 de octubre en Riocentro, con programación gratuita para profesionales de construcción, petróleo y gas, hospitalidad y refrigeración. Los edificios representan el 52% del consumo eléctrico de Brasil, según el Balance Energético Nacional 2026 (EPE), lo que refuerza el papel del HVAC-R en estos mercados.' },

const i18n={pt:{sub:'Principais notícias do mercado de climatização e refrigeração na América Latina',meta:'Semana de 31 de agosto a 6 de setembro de 2026 · Atualizado em: 31/08/2026',all:'Todas',event:'🎪 Feiras & Eventos',market:'📈 Mercado',reg:'📋 Regulação',brand:'🏭 Fabricantes',showing:'Exibindo',news:'notícias',labels:{event:'Feira/Evento',market:'Mercado',reg:'Regulação',brand:'Fabricante'},periods:{week:'📅 Semana Passada',month:'🗓️ Este Mês',lastmonth:'📆 Mês Passado',context:'⚠️ Conteúdo Relevante (Data Não Confirmada)'},dateUnknown:'⚠️ Data não confirmada',source:'Fonte',readMore:'Leia mais →'},en:{sub:'Top news from the HVACR market in Latin America',meta:'Week of August 31 – September 6, 2026 · Updated: 08/31/2026',all:'All',event:'🎪 Trade Shows',market:'📈 Market',reg:'📋 Regulation',brand:'🏭 Manufacturers',showing:'Showing',news:'news items',labels:{event:'Event',market:'Market',reg:'Regulation',brand:'Manufacturer'},periods:{week:'📅 Last Week',month:'🗓️ This Month',lastmonth:'📆 Last Month',context:'⚠️ Relevant Content (Date Not Confirmed)'},dateUnknown:'⚠️ Date not confirmed',source:'Source',readMore:'Read more →'},es:{sub:'Principales noticias del mercado HVACR en América Latina',meta:'Semana del 31 de agosto al 6 de septiembre de 2026 · Actualizado: 31/08/2026',all:'Todas',event:'🎪 Ferias & Eventos',market:'📈 Mercado',reg:'📋 Regulación',brand:'🏭 Fabricantes',showing:'Mostrando',news:'noticias',labels:{event:'Feria/Evento',market:'Mercado',reg:'Regulación',brand:'Fabricante'},periods:{week:'📅 Semana Pasada',month:'🗓️ Este Mes',lastmonth:'📆 Mes Pasado',context:'⚠️ Contenido Relevante (Fecha No Confirmada)'},dateUnknown:'⚠️ Fecha no confirmada',source:'Fuente',readMore:'Leer más →'}};
const periodOrder=['week','month','lastmonth','context'];
let currentLang='pt',activeFilter='all';
function setLang(l){currentLang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));const t=i18n[l];document.getElementById('header-sub').textContent=t.sub;document.getElementById('header-meta').textContent=t.meta;document.getElementById('btn-all').textContent=t.all;document.getElementById('btn-event').textContent=t.event;document.getElementById('btn-market').textContent=t.market;document.getElementById('btn-reg').textContent=t.reg;document.getElementById('btn-brand').textContent=t.brand;renderGrid()}
function setFilter(f){activeFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+f).classList.add('active');renderGrid()}
function renderGrid(){
  const t=i18n[currentLang];
  const filtered=(activeFilter==='all'?news:news.filter(n=>n.cat===activeFilter)).slice().sort((a,b)=>{
    if(a.period==='context'&&b.period!=='context') return 1;
    if(b.period==='context'&&a.period!=='context') return -1;
    if(a.period==='context'&&b.period==='context') return 0;
    return new Date(b.date)-new Date(a.date);
  });
  document.getElementById('count-bar').innerHTML=`<span>${filtered.length}</span> ${t.news}`;
  let html='';
  let counter=0;
  periodOrder.forEach(p=>{
    const group=filtered.filter(n=>n.period===p);
    if(group.length===0) return;
    html+=`<div class="period-heading">${t.periods[p]}</div>`;
    group.forEach(n=>{
      counter++;
      const d=n[currentLang];
      const dateHtml = n.period==='context' ? `<span class="card-warn">${t.dateUnknown}</span>` : `<div class="card-date">${n.date}</div>`;
      html+=`<div class="news-card"><div class="card-top"><span class="badge badge-${n.cat}">${t.labels[n.cat]}</span><span class="card-num">#${counter}</span></div><div class="card-title">${d.title}</div><div class="card-body">${d.body}</div>${dateHtml}<div class="card-footer"><span class="card-source">${t.source}: ${n.source}</span><a class="card-link" href="${n.url}" target="_blank">${t.readMore}</a></div></div>`;
    });
  });
  document.getElementById('grid').innerHTML=html;
}
setLang('pt');
</script>
</body>
</html>
