<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVACR LATAM — Radar Semanal</title>
<style>
  :root { color-scheme: light; --bg:#f4f6f9;--card:#ffffff;--header-bg:#0d1b2a;--header-accent:#1e88e5;--text:#1a1a2e;--text-muted:#6b7280;--border:#e5e7eb;--badge-market:#1e88e5;--badge-reg:#43a047;--badge-brand:#e53935;--badge-event:#fb8c00;--badge-pin:#8e24aa;--tag-bg-market:#e3f2fd;--tag-bg-reg:#e8f5e9;--tag-bg-brand:#ffebee;--tag-bg-event:#fff3e0;--tag-bg-pin:#f3e5f5;--shadow:0 1px 4px rgba(0,0,0,0.08);--warn:#92400e;--warn-bg:#fef3c7; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--header-bg);color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;flex-direction:column;gap:4px}
  .header-title{font-size:1.25rem;font-weight:700}
  .header-sub{font-size:0.78rem;color:#90caf9}
  .header-meta{font-size:0.72rem;color:#78909c;margin-top:2px}
  .lang-switcher{display:flex;gap:6px}
  .lang-btn{background:transparent;border:1.5px solid #455a64;color:#90caf9;padding:5px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .lang-btn.active{background:var(--header-accent);border-color:var(--header-accent);color:#fff}
  .toolbar{padding:16px 28px 0;display:flex;gap:8px;flex-wrap:wrap}
  .filter-btn{background:var(--card);border:1.5px solid var(--border);color:var(--text-muted);padding:5px 16px;border-radius:20px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .filter-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
  .period-heading{grid-column:1/-1;font-size:0.82rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;padding:18px 4px 2px;border-bottom:2px solid var(--border)}
  .period-heading:first-child{padding-top:4px}
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px 28px 32px}
  .news-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow 0.15s,transform 0.15s}
  .news-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.12);transform:translateY(-2px)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
  .badge-market{background:var(--tag-bg-market);color:var(--badge-market)}
  .badge-reg{background:var(--tag-bg-reg);color:var(--badge-reg)}
  .badge-brand{background:var(--tag-bg-brand);color:var(--badge-brand)}
  .badge-event{background:var(--tag-bg-event);color:var(--badge-event)}
  .badge-pin{background:var(--tag-bg-pin);color:var(--badge-pin)}
  .card-num{font-size:0.7rem;font-weight:700;color:#d1d5db}
  .card-title{font-size:0.95rem;font-weight:700;line-height:1.35;color:var(--text)}
  .card-body{font-size:0.82rem;color:var(--text-muted);line-height:1.6}
  .card-date{font-size:0.68rem;color:#9ca3af;font-weight:600}
  .card-warn{font-size:0.68rem;color:var(--warn);font-weight:700;background:var(--warn-bg);display:inline-block;padding:2px 8px;border-radius:8px}
  .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
  .card-source{font-size:0.7rem;color:#9ca3af;font-style:italic}
  .card-link{font-size:0.7rem;color:var(--header-accent);text-decoration:none;font-weight:600}
  .count-bar{padding:8px 28px 0;font-size:0.75rem;color:var(--text-muted)}
  .count-bar span{font-weight:700;color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="header-title">📡 HVACR LATAM — Radar Semanal</div>
    <div class="header-sub" id="header-sub"></div>
    <div class="header-meta" id="header-meta"></div>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
  </div>
</header>
<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all')" id="btn-all"></button>
  <button class="filter-btn" onclick="setFilter('event')" id="btn-event"></button>
  <button class="filter-btn" onclick="setFilter('market')" id="btn-market"></button>
  <button class="filter-btn" onclick="setFilter('reg')" id="btn-reg"></button>
  <button class="filter-btn" onclick="setFilter('brand')" id="btn-brand"></button>
  <button class="filter-btn" onclick="setFilter('pin')" id="btn-pin"></button>
</div>
<div class="count-bar" id="count-bar"></div>
<div class="news-grid" id="grid"></div>
<script>
// DADOS — notícias selecionadas (filtradas por recência <= 60 dias, + item(ns) period:'context')
const news = [
  {
    cat: 'pin',
    date: '2026-07-17',
    period: 'pinned',
    pt: { title: 'Termômetro ABRAVA – Julho 2026: cenário econômico e indicadores do setor AVACR', body: 'Boletim consolidado pela ABRAVA reúne cenário macroeconômico (PIB de 1,99% em 2026, IPCA em 5,16%, alta de 32% no Brent no ano por conta do conflito Irã-EUA) e os resultados do Termômetro ABRAVA do 2º trimestre: confiança do setor saiu do pessimismo para a neutralidade, faturamento caiu 0,5% na comparação anual e custos de insumos subiram 19,9%. O El Niño, com 97% de probabilidade de persistência até 2027, aparece como oportunidade de demanda para climatização e refrigeração no 2º semestre.' },
    en: { title: 'ABRAVA Thermometer – July 2026: economic outlook and HVACR sector indicators', body: 'ABRAVA’s consolidated bulletin covers the macro scenario (1.99% GDP growth in 2026, 5.16% inflation, Brent crude up 32% year-to-date on the Iran-US conflict) alongside Q2 Thermometer results: sector confidence moved from pessimism to neutral, revenue fell 0.5% year-over-year and input costs rose 19.9%. El Niño, with a 97% chance of persisting into 2027, is flagged as a demand opportunity for cooling and refrigeration in the second half of the year.' },
    es: { title: 'Termómetro ABRAVA – Julio 2026: panorama económico e indicadores del sector AVACR', body: 'El boletín consolidado por ABRAVA reúne el escenario macroeconómico (PIB de 1,99% en 2026, IPCA de 5,16%, alza de 32% del Brent en el año por el conflicto Irán-EE.UU.) y los resultados del Termómetro ABRAVA del 2º trimestre: la confianza del sector pasó del pesimismo a la neutralidad, la facturación cayó 0,5% interanual y los costos de insumos subieron 19,9%. El Niño, con 97% de probabilidad de persistir hasta 2027, se señala como una oportunidad de demanda para climatización y refrigeración en el segundo semestre.' },
    source: 'ABRAVA',
    url: 'https://abrava.com.br/wp-content/uploads/2026/07/RESUMIDA-Conjuntura-julho-26-final.pdf'
  },
  {
    cat: 'reg',
    date: '2026-07-02',
    period: 'month',
    pt: { title: 'Resolução Gecex nº 932/2026 altera ex-tarifários de bens de capital, com reflexo em compressores (NCM 8414)', body: 'Publicada em 2 de julho, a resolução altera o Anexo Único da Resolução Gecex nº 780/2025 para conceder e modificar Ex-tarifários de Bens de Capital — categoria que inclui itens do capítulo 8414, onde está classificado o NCM 8414.30.19 usado por importadores de compressores frigoríficos. É o desdobramento mais recente após o realinhamento tarifário da Resolução Gecex 852/2026, que havia elevado alíquotas de importação de bens de capital no início do ano.' },
    en: { title: 'Gecex Resolution 932/2026 amends capital goods ex-tariffs, touching compressors (HS 8414)', body: 'Published July 2, the resolution amends the Annex to Gecex Resolution 780/2025, granting and altering ex-tariffs for capital goods — a category covering chapter 8414 items, including HS code 8414.30.19 used by refrigeration compressor importers. It is the latest development since Gecex Resolution 852/2026 raised capital-goods import tariffs earlier this year.' },
    es: { title: 'Resolución Gecex 932/2026 modifica ex-aranceles de bienes de capital y afecta a compresores (NCM 8414)', body: 'Publicada el 2 de julio, la resolución modifica el Anexo Único de la Resolución Gecex 780/2025, para conceder y alterar Ex-aranceles de Bienes de Capital, categoría que incluye ítems del capítulo 8414 — donde se clasifica el NCM 8414.30.19 usado por importadores de compresores frigoríficos. Es el desdoblamiento más reciente tras el realineamiento arancelario de la Resolución Gecex 852/2026, que había elevado los aranceles de bienes de capital a inicios de año.' },
    source: 'Efficienza Comércio Internacional',
    url: 'https://efficienza.com.br/resolucao-gecex-no-932-de-2-de-julho-de-2026/'
  },
  {
    cat: 'brand',
    date: '2026-06-29',
    period: 'month',
    pt: { title: 'LG celebra 11 anos como marca nº 1 em ar-condicionado na América Latina', body: 'Segundo dados da Euromonitor International (2015–2025), a LG Electronics manteve a liderança no mercado latino-americano de ar-condicionado pelo 11º ano consecutivo, resultado atribuído à estratégia de eficiência energética e durabilidade dos produtos na região.' },
    en: { title: 'LG marks 11 years as the No. 1 air conditioning brand in Latin America', body: 'According to Euromonitor International data (2015–2025), LG Electronics held the top spot in Latin America’s air conditioning market for an 11th consecutive year, a result the company attributes to its focus on energy efficiency and product durability in the region.' },
    es: { title: 'LG celebra 11 años como marca N.º 1 en aire acondicionado en América Latina', body: 'Según datos de Euromonitor International (2015–2025), LG Electronics mantuvo el liderazgo en el mercado latinoamericano de aire acondicionado por 11.º año consecutivo, resultado que la compañía atribuye a su estrategia de eficiencia energética y durabilidad de producto en la región.' },
    source: 'PR Newswire Brasil',
    url: 'https://www.prnewswire.com/br/comunicados-para-a-imprensa/lg-celebra-11-anos-como-marca-n-1-em-ar-condicionado-na-america-latina-302813508.html'
  },
  {
    cat: 'event',
    date: '2026-06-22',
    period: 'month',
    pt: { title: 'AirCon Fair 2026 estreia como novo polo HVAC-R da América Latina em São Paulo', body: 'Entre 22 e 25 de junho, a feira ocorreu no Distrito Anhembi dentro da Eletrolar Show All Connected, reunindo fabricantes, distribuidores e instaladores em um novo hub de negócios dedicado especificamente ao setor de climatização e refrigeração.' },
    en: { title: 'AirCon Fair 2026 debuts as Latin America’s new HVAC-R hub in São Paulo', body: 'Held June 22–25 at Distrito Anhembi alongside Eletrolar Show All Connected, the fair brought together manufacturers, distributors and installers in a new business hub dedicated specifically to the HVAC-R sector.' },
    es: { title: 'AirCon Fair 2026 debuta como el nuevo polo HVAC-R de América Latina en São Paulo', body: 'Realizada del 22 al 25 de junio en el Distrito Anhembi, dentro de Eletrolar Show All Connected, la feria reunió a fabricantes, distribuidores e instaladores en un nuevo hub de negocios dedicado específicamente al sector HVAC-R.' },
    source: 'Aircon Fair',
    url: 'https://airconfair.com.br/bem-vindo-ao-universo-aircon-o-novo-polo-hvac-r-da-america-latina/'
  },
  {
    cat: 'brand',
    date: '2026-06-18',
    period: 'lastmonth',
    pt: { title: 'Trane põe em operação um dos maiores sistemas solares industriais do México, em Monterrey', body: 'Com cerca de 10 mil painéis solares distribuídos em três das cinco plantas do complexo, o sistema vai gerar 9.300 MWh de energia limpa por ano — cerca de 40% da necessidade energética da unidade — evitando a emissão de cerca de 4.100 toneladas de CO2 por ano.' },
    en: { title: 'Trane brings one of Mexico’s largest industrial solar systems online in Monterrey', body: 'With roughly 10,000 solar panels spread across three of the complex’s five plants, the system will generate 9,300 MWh of clean energy a year — about 40% of the facility’s energy needs — avoiding an estimated 4,100 tons of CO2 emissions annually.' },
    es: { title: 'Trane pone en operación uno de los mayores sistemas solares industriales de México, en Monterrey', body: 'Con cerca de 10 mil paneles solares distribuidos en tres de las cinco plantas del complejo, el sistema generará 9.300 MWh de energía limpia al año —alrededor del 40% de la necesidad energética de la planta— evitando la emisión de unas 4.100 toneladas de CO2 al año.' },
    source: 'Edificios de México',
    url: 'https://www.edemx.com/site/2026/06/18/planta-trane-monterrey-pone-en-operacion-uno-de-los-sistemas-solares-para-autoconsumo-mas-relevantes-de-mexico/'
  },
  {
    cat: 'brand',
    date: '2026-06-12',
    period: 'lastmonth',
    pt: { title: 'Daikin sinaliza plano de expansão da fábrica de Manaus após visita da Suframa', body: 'Em visita técnica realizada em 12 de junho ao Polo Industrial de Manaus, a Suframa discutiu com a Daikin planos de ampliar a produção local de condicionadores de ar residenciais e comerciais leves, reforçando a aposta da companhia na Zona Franca de Manaus e a verticalização da cadeia produtiva.' },
    en: { title: 'Daikin signals plan to expand Manaus factory after Suframa visit', body: 'During a June 12 technical visit to the Manaus Industrial Hub, Suframa discussed plans with Daikin to expand local production of residential and light-commercial air conditioners, reinforcing the company’s commitment to the Manaus Free Trade Zone and deeper local supply-chain integration.' },
    es: { title: 'Daikin señala plan de expansión de su fábrica en Manaos tras visita de Suframa', body: 'En una visita técnica el 12 de junio al Polo Industrial de Manaos, Suframa discutió con Daikin planes para ampliar la producción local de aires acondicionados residenciales y comerciales ligeros, reforzando la apuesta de la compañía por la Zona Franca de Manaos y la verticalización de la cadena productiva.' },
    source: 'Suframa',
    url: 'https://www.gov.br/suframa/pt-br/assuntos/noticias/suframa-visita-fabrica-da-daikin-e-debate-fortalecimento-do-setor-de-condicionadores-de-ar-no-pim'
  },
  {
    cat: 'reg',
    date: null,
    period: 'context',
    pt: { title: 'O que são refrigerantes A2L e por que sua adoção avança na refrigeração e climatização', body: 'Conteúdo técnico sobre a classificação de inflamabilidade A2L (ASHRAE 34) e os cuidados de manuseio e norma aplicáveis. Tema estrutural para o setor diante da transição regional para fluidos de menor GWP — data de publicação original não confirmada.' },
    en: { title: 'What A2L refrigerants are and why their adoption is advancing in refrigeration and HVAC', body: 'Technical background on the A2L flammability classification (ASHRAE 34) and applicable handling and safety standards. A structural topic for the industry amid the region’s shift toward lower-GWP fluids — original publication date not confirmed.' },
    es: { title: 'Qué son los refrigerantes A2L y por qué avanza su adopción en refrigeración y climatización', body: 'Contenido técnico sobre la clasificación de inflamabilidad A2L (ASHRAE 34) y las precauciones de manejo y normativa aplicable. Tema estructural para el sector ante la transición regional hacia fluidos de menor GWP — fecha de publicación original no confirmada.' },
    source: 'Copeland / Opteon',
    url: 'https://www.opteon.com/en/understanding-a2l-refrigerants'
  }
];

const i18n={pt:{sub:'Principais notícias do mercado de climatização e refrigeração na América Latina',meta:'Semana de 14–20 de julho de 2026 · Atualizado em: 20/07/2026',all:'Todas',event:'🎪 Feiras & Eventos',market:'📈 Mercado',reg:'📋 Regulação',brand:'🏭 Fabricantes',pin:'🎯 Destaques',showing:'Exibindo',news:'notícias',labels:{event:'Feira/Evento',market:'Mercado',reg:'Regulação',brand:'Fabricante',pin:'Destaque'},periods:{pinned:'🎯 Destaques',week:'📅 Semana Passada',month:'🗓️ Este Mês',lastmonth:'📆 Mês Passado',context:'⚠️ Conteúdo Relevante (Data Não Confirmada)'},dateUnknown:'⚠️ Data não confirmada',source:'Fonte',readMore:'Leia mais →'},en:{sub:'Top news from the HVACR market in Latin America',meta:'Week of July 14–20, 2026 · Updated: 07/20/2026',all:'All',event:'🎪 Trade Shows',market:'📈 Market',reg:'📋 Regulation',brand:'🏭 Manufacturers',pin:'🎯 Highlights',showing:'Showing',news:'news items',labels:{event:'Event',market:'Market',reg:'Regulation',brand:'Manufacturer',pin:'Highlight'},periods:{pinned:'🎯 Highlights',week:'📅 Last Week',month:'🗓️ This Month',lastmonth:'📆 Last Month',context:'⚠️ Relevant Content (Date Not Confirmed)'},dateUnknown:'⚠️ Date not confirmed',source:'Source',readMore:'Read more →'},es:{sub:'Principales noticias del mercado HVACR en América Latina',meta:'Semana del 14 al 20 de julio de 2026 · Actualizado: 20/07/2026',all:'Todas',event:'🎪 Ferias & Eventos',market:'📈 Mercado',reg:'📋 Regulación',brand:'🏭 Fabricantes',pin:'🎯 Destacados',showing:'Mostrando',news:'noticias',labels:{event:'Feria/Evento',market:'Mercado',reg:'Regulación',brand:'Fabricante',pin:'Destacado'},periods:{pinned:'🎯 Destacados',week:'📅 Semana Pasada',month:'🗓️ Este Mes',lastmonth:'📆 Mes Pasado',context:'⚠️ Contenido Relevante (Fecha No Confirmada)'},dateUnknown:'⚠️ Fecha no confirmada',source:'Fuente',readMore:'Leer más →'}};
const periodOrder=['pinned','week','month','lastmonth','context'];
let currentLang='pt',activeFilter='all';
function setLang(l){currentLang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));const t=i18n[l];document.getElementById('header-sub').textContent=t.sub;document.getElementById('header-meta').textContent=t.meta;document.getElementById('btn-all').textContent=t.all;document.getElementById('btn-event').textContent=t.event;document.getElementById('btn-market').textContent=t.market;document.getElementById('btn-reg').textContent=t.reg;document.getElementById('btn-brand').textContent=t.brand;document.getElementById('btn-pin').textContent=t.pin;renderGrid()}
function setFilter(f){activeFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+f).classList.add('active');renderGrid()}
function renderGrid(){
  const t=i18n[currentLang];
  const filtered=(activeFilter==='all'?news:news.filter(n=>n.cat===activeFilter)).slice().sort((a,b)=>{
    const rank=p=>p==='pinned'?-1:p==='context'?1:0;
    const ra=rank(a.period), rb=rank(b.period);
    if(ra!==rb) return ra-rb;
    if(ra!==0) return 0;
    return new Date(b.date)-new Date(a.date);
  });
  document.getElementById('count-bar').innerHTML=`<span>${filtered.length}</span> ${t.news}`;
  let html='';
  let counter=0;
  periodOrder.forEach(p=>{
    const group=filtered.filter(n=>n.period===p);
    if(group.length===0) return;
    html+=`<div class="period-heading">${t.periods[p]}</div>`;
    group.forEach(n=>{
      counter++;
      const d=n[currentLang];
      const dateHtml = n.period==='context' ? `<span class="card-warn">${t.dateUnknown}</span>` : `<div class="card-date">${n.date}</div>`;
      html+=`<div class="news-card"><div class="card-top"><span class="badge badge-${n.cat}">${t.labels[n.cat]}</span><span class="card-num">#${counter}</span></div><div class="card-title">${d.title}</div><div class="card-body">${d.body}</div>${dateHtml}<div class="card-footer"><span class="card-source">${t.source}: ${n.source}</span><a class="card-link" href="${n.url}" target="_blank">${t.readMore}</a></div></div>`;
    });
  });
  document.getElementById('grid').innerHTML=html;
}
setLang('pt');
</script>
</body>
</html>
