<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HVACR LATAM — Radar Semanal</title>
<style>
  :root { color-scheme: light; --bg:#f4f6f9;--card:#ffffff;--header-bg:#0d1b2a;--header-accent:#1e88e5;--text:#1a1a2e;--text-muted:#6b7280;--border:#e5e7eb;--badge-market:#1e88e5;--badge-reg:#43a047;--badge-brand:#e53935;--badge-event:#fb8c00;--tag-bg-market:#e3f2fd;--tag-bg-reg:#e8f5e9;--tag-bg-brand:#ffebee;--tag-bg-event:#fff3e0;--shadow:0 1px 4px rgba(0,0,0,0.08);--warn:#92400e;--warn-bg:#fef3c7; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text)}
  header{background:var(--header-bg);color:#fff;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
  .header-left{display:flex;flex-direction:column;gap:4px}
  .header-title{font-size:1.25rem;font-weight:700}
  .header-sub{font-size:0.78rem;color:#90caf9}
  .header-meta{font-size:0.72rem;color:#78909c;margin-top:2px}
  .lang-switcher{display:flex;gap:6px}
  .lang-btn{background:transparent;border:1.5px solid #455a64;color:#90caf9;padding:5px 14px;border-radius:20px;font-size:0.75rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .lang-btn.active{background:var(--header-accent);border-color:var(--header-accent);color:#fff}
  .toolbar{padding:16px 28px 0;display:flex;gap:8px;flex-wrap:wrap}
  .filter-btn{background:var(--card);border:1.5px solid var(--border);color:var(--text-muted);padding:5px 16px;border-radius:20px;font-size:0.78rem;font-weight:600;cursor:pointer;transition:all 0.15s}
  .filter-btn.active{background:var(--text);color:#fff;border-color:var(--text)}
  .period-heading{grid-column:1/-1;font-size:0.82rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.04em;padding:18px 4px 2px;border-bottom:2px solid var(--border)}
  .period-heading:first-child{padding-top:4px}
  .news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:16px 28px 32px}
  .news-card{background:var(--card);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--border);padding:18px 20px;display:flex;flex-direction:column;gap:10px;transition:box-shadow 0.15s,transform 0.15s}
  .news-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.12);transform:translateY(-2px)}
  .card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:12px;font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
  .badge-market{background:var(--tag-bg-market);color:var(--badge-market)}
  .badge-reg{background:var(--tag-bg-reg);color:var(--badge-reg)}
  .badge-brand{background:var(--tag-bg-brand);color:var(--badge-brand)}
  .badge-event{background:var(--tag-bg-event);color:var(--badge-event)}
  .card-num{font-size:0.7rem;font-weight:700;color:#d1d5db}
  .card-title{font-size:0.95rem;font-weight:700;line-height:1.35;color:var(--text)}
  .card-body{font-size:0.82rem;color:var(--text-muted);line-height:1.6}
  .card-date{font-size:0.68rem;color:#9ca3af;font-weight:600}
  .card-warn{font-size:0.68rem;color:var(--warn);font-weight:700;background:var(--warn-bg);display:inline-block;padding:2px 8px;border-radius:8px}
  .card-footer{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--border)}
  .card-source{font-size:0.7rem;color:#9ca3af;font-style:italic}
  .card-link{font-size:0.7rem;color:var(--header-accent);text-decoration:none;font-weight:600}
  .count-bar{padding:8px 28px 0;font-size:0.75rem;color:var(--text-muted)}
  .count-bar span{font-weight:700;color:var(--text)}
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="header-title">📡 HVACR LATAM — Radar Semanal</div>
    <div class="header-sub" id="header-sub"></div>
    <div class="header-meta" id="header-meta"></div>
  </div>
  <div class="lang-switcher">
    <button class="lang-btn active" onclick="setLang('pt')">PT</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
    <button class="lang-btn" onclick="setLang('es')">ES</button>
  </div>
</header>
<div class="toolbar">
  <button class="filter-btn active" onclick="setFilter('all')" id="btn-all"></button>
  <button class="filter-btn" onclick="setFilter('event')" id="btn-event"></button>
  <button class="filter-btn" onclick="setFilter('market')" id="btn-market"></button>
  <button class="filter-btn" onclick="setFilter('reg')" id="btn-reg"></button>
  <button class="filter-btn" onclick="setFilter('brand')" id="btn-brand"></button>
</div>
<div class="count-bar" id="count-bar"></div>
<div class="news-grid" id="grid"></div>
<script>
// DADOS
const news = [
  {
    cat: 'reg',
    date: '2026-07-20',
    period: 'month',
    pt: { title: 'Tarifa adicional de 25% dos EUA amplia cautela na cadeia HVAC-R brasileira', body: 'Em vigor desde 22 de julho, a tarifa adicional dos EUA sobre produtos brasileiros pressiona custos de aço, alumínio e componentes importados pela cadeia HVAC-R, apesar da baixa exposição direta do setor ao mercado consumidor americano. O Termômetro AVACR da ABRAVA já registra alta na inflação setorial (5,11% projetada) e queda na confiança empresarial. A CNI propôs ao governo federal a criação de uma sétima missão da Nova Indústria Brasil (NIB) voltada aos setores atingidos pela tarifa.' },
    en: { title: "Additional 25% U.S. tariff adds caution to Brazil's HVAC-R supply chain", body: "In effect since July 22, the additional U.S. tariff on Brazilian goods is pressuring costs for imported steel, aluminum and components used across the HVAC-R chain, even though the sector's direct exposure to the U.S. consumer market is limited. ABRAVA's AVACR Thermometer already shows rising sector inflation (5.11% projected) and weaker business confidence. Brazil's National Confederation of Industry (CNI) proposed a seventh Nova Indústria Brasil (NIB) mission targeting sectors hit by the tariff." },
    es: { title: 'El arancel adicional del 25% de EE.UU. aumenta la cautela en la cadena HVAC-R de Brasil', body: 'Vigente desde el 22 de julio, el arancel adicional de EE.UU. sobre productos brasileños presiona los costos de acero, aluminio y componentes importados por la cadena HVAC-R, pese a la baja exposición directa del sector al mercado estadounidense. El Termómetro AVACR de ABRAVA ya registra mayor inflación sectorial (5,11% proyectada) y caída de la confianza empresarial. La CNI propuso al gobierno federal una séptima misión de Nova Indústria Brasil (NIB) para los sectores afectados por el arancel.' },
    source: 'Revista do Frio / SINDRATARPE',
    url: 'https://www.sindratarpe.org.br/2026/07/20/tarifa-de-25-dos-eua-amplia-cautela-no-hvac-r/'
  },
  {
    cat: 'reg',
    date: '2026-08-04',
    period: 'month',
    pt: { title: 'Sobretaxa de 25% dos EUA entra em vigor e soma-se a tarifa de 12,5%, chegando a até 37,5%', body: 'A partir de 23 de julho, os EUA passaram a aplicar tarifas adicionais de 25% e 12,5% sobre produtos brasileiros — que juntas podem chegar a 37,5% para itens alcançados pelas duas medidas —, atingindo 26,2% das exportações do Brasil aos EUA (~US$ 11 bilhões). Especialistas da Falconi recomendam diversificação de mercados, eficiência operacional e maior coordenação setorial como resposta ao choque tarifário.' },
    en: { title: 'U.S. 25% surtax takes effect, stacking with 12.5% tariff for up to 37.5% combined', body: "As of July 23, the U.S. began applying additional 25% and 12.5% tariffs on Brazilian goods — which together can reach 37.5% for items hit by both measures — affecting 26.2% of Brazil's exports to the U.S. (about US$11 billion). Falconi consultants recommend market diversification, operational efficiency and stronger sector coordination in response to the tariff shock." },
    es: { title: 'La sobretasa del 25% de EE.UU. entra en vigor y se suma al arancel del 12,5%, hasta un 37,5% combinado', body: 'Desde el 23 de julio, EE.UU. aplica aranceles adicionales del 25% y 12,5% a productos brasileños —que juntos pueden llegar al 37,5% para los ítems alcanzados por ambas medidas—, afectando al 26,2% de las exportaciones de Brasil a EE.UU. (unos US$11.000 millones). Consultores de Falconi recomiendan diversificación de mercados, eficiencia operativa y mayor coordinación sectorial ante el shock arancelario.' },
    source: 'Portal Revista Kdea 360',
    url: 'https://revistakdea360.com.br/noticia/81652/sobretaxa-de-25-dos-eua-sobre-importacoes-brasileiras-entra-em-vigor-e-exige-acao-integrada-da-industria-nacional'
  },
  {
    cat: 'reg',
    date: '2026-08-10',
    period: 'week',
    pt: { title: 'Sobretaxa combinada de 37,5% dos EUA atinge 36% do volume de exportação do Nordeste', body: 'Levantamento do Etene/BNB estima que a sobretaxa combinada de 37,5% (25% + 12,5%, vigente desde 22 de julho) atinja diretamente 8 dos 15 principais itens exportados pelo Nordeste, responsáveis por 36% das vendas da região aos EUA no 1º semestre (mais de US$ 450 milhões). Ao todo, 639 produtos foram taxados; economistas apontam diversificação de mercados e crédito do FNE como saídas.' },
    en: { title: "Combined 37.5% U.S. surtax hits 36% of Brazil's Northeast export volume", body: "A survey by Etene/BNB estimates the combined 37.5% U.S. surtax (25% + 12.5%, in effect since July 22) directly hits 8 of the Northeast region's 15 main export items, which accounted for 36% of the region's sales to the U.S. in H1 (over US$450 million). In total, 639 products were taxed; economists point to market diversification and FNE credit lines as ways forward." },
    es: { title: 'La sobretasa combinada del 37,5% de EE.UU. golpea el 36% del volumen exportador del Nordeste brasileño', body: 'Un relevamiento de Etene/BNB estima que la sobretasa combinada del 37,5% de EE.UU. (25% + 12,5%, vigente desde el 22 de julio) afecta directamente a 8 de los 15 principales ítems exportados por el Nordeste, responsables del 36% de las ventas de la región a EE.UU. en el primer semestre (más de US$450 millones). En total, 639 productos fueron gravados; los economistas señalan la diversificación de mercados y el crédito del FNE como salidas.' },
    source: 'CBN Recife / SINDRATARPE',
    url: 'https://www.sindratarpe.org.br/2026/08/10/taxacao-dos-eua-a-produtos-brasileiros-impacta-36-do-volume-de-exportacao-do-nordeste/'
  },
  {
    cat: 'event',
    date: '2026-08-12',
    period: 'week',
    pt: { title: 'AHR Expo México 2026 celebra 30 anos e reúne 440 expositores em Guadalajara', body: 'De 29 de setembro a 1º de outubro, a maior feira de HVACR da América Latina ocupará 20.000 m² na Expo Guadalajara, reunindo mais de 440 empresas de 15 países e cerca de 13 mil profissionais. A edição 2026 marca os 30 anos do evento, com mais de 60 conferências certificadas pela ASHRAE distribuídas em 7 salas simultâneas.' },
    en: { title: 'AHR Expo México 2026 marks 30 years, brings 440 exhibitors to Guadalajara', body: 'From September 29 to October 1, Latin America’s largest HVACR trade show will occupy 20,000 m² at Expo Guadalajara, gathering more than 440 companies from 15 countries and around 13,000 professionals. The 2026 edition marks the event’s 30th anniversary, with over 60 ASHRAE-certified conferences across 7 simultaneous tracks.' },
    es: { title: 'AHR Expo México 2026 celebra 30 años y reúne a 440 expositores en Guadalajara', body: 'Del 29 de septiembre al 1 de octubre, la feria HVACR más grande de América Latina ocupará 20.000 m² en Expo Guadalajara, reuniendo a más de 440 empresas de 15 países y cerca de 13.000 profesionales. La edición 2026 marca los 30 años del evento, con más de 60 conferencias certificadas por ASHRAE en 7 salones simultáneos.' },
    source: 'ACR Latinoamérica',
    url: 'https://www.acrlatinoamerica.com/novedades/ultimas-noticias/22-empresas/21195-ahr-expo-mexico-2026-arranca-en-guadalajara-la-celebracion-de-sus-30-anos-de-industria-hvacr.html'
  },
  {
    cat: 'market',
    date: '2026-08-12',
    period: 'week',
    pt: { title: 'Calor de data centers de IA vira desafio central para o HVACR no México', body: 'O crescimento acelerado da IA e da nuvem eleva a densidade térmica dos data centers — de 3-5 kW por rack há uma década para até 60 kW hoje — pressionando estratégias de resfriamento e eficiência energética. No México, a Sener estima demanda adicional de 1.500 MW até 2030 só para data centers, com investimentos de US$ 18 bilhões previstos pela MEXDC nos próximos cinco anos; liquid cooling ganha espaço frente aos sistemas a ar.' },
    en: { title: "Heat from AI data centers becomes a central challenge for Mexico's HVACR sector", body: 'The rapid growth of AI and cloud computing is raising data center thermal density — from 3-5 kW per rack a decade ago to as much as 60 kW today — straining cooling strategies and energy efficiency. In Mexico, Sener estimates an additional 1,500 MW of demand by 2030 from data centers alone, with US$18 billion in investment projected by MEXDC over the next five years; liquid cooling is gaining ground over air-based systems.' },
    es: { title: 'El calor de los centros de datos de IA se vuelve un reto central para el HVACR en México', body: 'El crecimiento acelerado de la IA y la nube eleva la densidad térmica de los centros de datos —de 3-5 kW por rack hace una década a hasta 60 kW hoy—, presionando las estrategias de enfriamiento y eficiencia energética. En México, la Sener estima una demanda adicional de 1.500 MW hacia 2030 solo por centros de datos, con inversiones de US$18.000 millones previstas por MEXDC en los próximos cinco años; el liquid cooling gana terreno frente a los sistemas de aire.' },
    source: 'ACR Latinoamérica',
    url: 'https://www.acrlatinoamerica.com/novedades/ultimas-noticias/22-empresas/21196-el-calor-se-convierte-en-uno-de-los-principales-desafios-para-los-centros-de-datos-impulsados-por-ia.html'
  },
  {
    cat: 'brand',
    date: '2026-08-12',
    period: 'week',
    pt: { title: 'BAC inaugura primeira planta de manufatura na América Latina, no México', body: 'A Baltimore Aircoil Company (BAC) inaugurou em 27 de maio sua primeira fábrica na região, em Ciénega de Flores, Nuevo León, ampliando capacidade de produção, logística e distribuição para clientes latino-americanos. A companhia, subsidiária da Amsted Industries, afirma ter investido mais nos últimos seis anos do que nas duas décadas anteriores combinadas.' },
    en: { title: 'BAC opens its first manufacturing plant in Latin America, in Mexico', body: 'Baltimore Aircoil Company (BAC) opened its first regional factory on May 27 in Ciénega de Flores, Nuevo León, expanding production, logistics and distribution capacity for Latin American customers. The company, an Amsted Industries subsidiary, says it has invested more in the past six years than in the previous two decades combined.' },
    es: { title: 'BAC inaugura su primera planta de manufactura en América Latina, en México', body: 'Baltimore Aircoil Company (BAC) inauguró el 27 de mayo su primera fábrica en la región, en Ciénega de Flores, Nuevo León, ampliando su capacidad de producción, logística y distribución para clientes latinoamericanos. La compañía, subsidiaria de Amsted Industries, afirma haber invertido más en los últimos seis años que en las dos décadas anteriores combinadas.' },
    source: 'ACR Latinoamérica',
    url: 'https://www.acrlatinoamerica.com/novedades/ultimas-noticias/22-empresas/21194-bac-inaugura-su-primera-planta-de-manufactura-en-latinoamerica.html'
  },
  {
    cat: 'event',
    date: '2026-08-05',
    period: 'month',
    pt: { title: 'ABRAVA é Hub Oficial da São Paulo Climate Week 2026 e amplia voz do setor AVACR', body: 'Entre 3 e 7 de agosto, a ABRAVA sediou o Hub de Cidades Resilientes, Água e Saneamento na São Paulo Climate Week 2026, reunindo debates sobre fluidos refrigerantes, tratamento de águas e qualidade do ar com empresas, poder público e academia. O painel de Qualidade do Ar Interior (QAI), em 6 de agosto, reuniu especialistas da ASHRAE, BRASINDOOR/QUALINDOOR e ABDEH.' },
    en: { title: "ABRAVA is Official Hub of São Paulo Climate Week 2026, amplifying the AVACR sector's voice", body: 'From August 3-7, ABRAVA hosted the Resilient Cities, Water and Sanitation Hub at São Paulo Climate Week 2026, gathering discussions on refrigerants, water treatment and air quality with companies, government and academia. An Indoor Air Quality (IAQ) panel on August 6 brought together experts from ASHRAE, BRASINDOOR/QUALINDOOR and ABDEH.' },
    es: { title: 'ABRAVA es Hub Oficial de la São Paulo Climate Week 2026 y amplifica la voz del sector AVACR', body: 'Del 3 al 7 de agosto, ABRAVA fue sede del Hub de Ciudades Resilientes, Agua y Saneamiento en la São Paulo Climate Week 2026, reuniendo debates sobre refrigerantes, tratamiento de aguas y calidad del aire con empresas, gobierno y academia. Un panel de Calidad del Aire Interior (QAI), el 6 de agosto, reunió a especialistas de ASHRAE, BRASINDOOR/QUALINDOOR y ABDEH.' },
    source: 'ABRAVA',
    url: 'https://abrava.com.br/56598-2/'
  },
  {
    cat: 'market',
    date: null,
    period: 'context',
    pt: { title: 'Refrigerantes naturais avançam na América Latina, mas desafios de implementação persistem', body: 'A região entra em uma fase mais madura na adoção de refrigerantes naturais (CO2, amônia, hidrocarbonetos): já são mais de 8.000 supermercados operando com sistemas transcríticos de CO2. O debate técnico deixou de ser "por que adotar" e passou a ser "como acelerar" — dependendo de incentivos, capacitação técnica e casos de uso comprovados.' },
    en: { title: 'Natural refrigerants advance in Latin America, but implementation challenges remain', body: "The region is entering a more mature phase in natural refrigerant adoption (CO2, ammonia, hydrocarbons): more than 8,000 supermarkets already operate transcritical CO2 systems. The technical conversation has shifted from 'why adopt' to 'how to accelerate' — depending on incentives, technical training and proven use cases." },
    es: { title: 'Los refrigerantes naturales avanzan en América Latina, pero persisten retos de implementación', body: 'La región entra en una etapa más madura en la adopción de refrigerantes naturales (CO2, amoníaco, hidrocarburos): ya operan más de 8.000 supermercados con sistemas transcríticos de CO2. El debate técnico dejó de ser "por qué adoptar" para pasar a "cómo acelerar" — dependiendo de incentivos, capacitación técnica y casos de uso comprobados.' },
    source: 'Mundo HVAC&R',
    url: 'https://www.mundohvacr.com/2026/04/el-nuevo-equilibrio-del-frio-entre-regulacion-eficiencia-y-nuevas-tecnologias-el-nuevo-mapa-del-frio-en-mexico-y-latinoamerica/'
  }
];

const i18n={pt:{sub:'Principais notícias do mercado de climatização e refrigeração na América Latina',meta:'Semana de 11–17 de agosto de 2026 · Atualizado em: 17/08/2026',all:'Todas',event:'🎪 Feiras & Eventos',market:'📈 Mercado',reg:'📋 Regulação',brand:'🏭 Fabricantes',showing:'Exibindo',news:'notícias',labels:{event:'Feira/Evento',market:'Mercado',reg:'Regulação',brand:'Fabricante'},periods:{week:'📅 Semana Passada',month:'🗓️ Este Mês',lastmonth:'📆 Mês Passado',context:'⚠️ Conteúdo Relevante (Data Não Confirmada)'},dateUnknown:'⚠️ Data não confirmada',source:'Fonte',readMore:'Leia mais →'},en:{sub:'Top news from the HVACR market in Latin America',meta:'Week of August 11–17, 2026 · Updated: 08/17/2026',all:'All',event:'🎪 Trade Shows',market:'📈 Market',reg:'📋 Regulation',brand:'🏭 Manufacturers',showing:'Showing',news:'news items',labels:{event:'Event',market:'Market',reg:'Regulation',brand:'Manufacturer'},periods:{week:'📅 Last Week',month:'🗓️ This Month',lastmonth:'📆 Last Month',context:'⚠️ Relevant Content (Date Not Confirmed)'},dateUnknown:'⚠️ Date not confirmed',source:'Source',readMore:'Read more →'},es:{sub:'Principales noticias del mercado HVACR en América Latina',meta:'Semana del 11 al 17 de agosto de 2026 · Actualizado: 17/08/2026',all:'Todas',event:'🎪 Ferias & Eventos',market:'📈 Mercado',reg:'📋 Regulación',brand:'🏭 Fabricantes',showing:'Mostrando',news:'noticias',labels:{event:'Feria/Evento',market:'Mercado',reg:'Regulación',brand:'Fabricante'},periods:{week:'📅 Semana Pasada',month:'🗓️ Este Mes',lastmonth:'📆 Mes Pasado',context:'⚠️ Contenido Relevante (Fecha No Confirmada)'},dateUnknown:'⚠️ Fecha no confirmada',source:'Fuente',readMore:'Leer más →'}};
const periodOrder=['week','month','lastmonth','context'];
let currentLang='pt',activeFilter='all';
function setLang(l){currentLang=l;document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent===l.toUpperCase()));const t=i18n[l];document.getElementById('header-sub').textContent=t.sub;document.getElementById('header-meta').textContent=t.meta;document.getElementById('btn-all').textContent=t.all;document.getElementById('btn-event').textContent=t.event;document.getElementById('btn-market').textContent=t.market;document.getElementById('btn-reg').textContent=t.reg;document.getElementById('btn-brand').textContent=t.brand;renderGrid()}
function setFilter(f){activeFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));document.getElementById('btn-'+f).classList.add('active');renderGrid()}
function renderGrid(){
  const t=i18n[currentLang];
  const filtered=(activeFilter==='all'?news:news.filter(n=>n.cat===activeFilter)).slice().sort((a,b)=>{
    if(a.period==='context'&&b.period!=='context') return 1;
    if(b.period==='context'&&a.period!=='context') return -1;
    if(a.period==='context'&&b.period==='context') return 0;
    return new Date(b.date)-new Date(a.date);
  });
  document.getElementById('count-bar').innerHTML=`<span>${filtered.length}</span> ${t.news}`;
  let html='';
  let counter=0;
  periodOrder.forEach(p=>{
    const group=filtered.filter(n=>n.period===p);
    if(group.length===0) return;
    html+=`<div class="period-heading">${t.periods[p]}</div>`;
    group.forEach(n=>{
      counter++;
      const d=n[currentLang];
      const dateHtml = n.period==='context' ? `<span class="card-warn">${t.dateUnknown}</span>` : `<div class="card-date">${n.date}</div>`;
      html+=`<div class="news-card"><div class="card-top"><span class="badge badge-${n.cat}">${t.labels[n.cat]}</span><span class="card-num">#${counter}</span></div><div class="card-title">${d.title}</div><div class="card-body">${d.body}</div>${dateHtml}<div class="card-footer"><span class="card-source">${t.source}: ${n.source}</span><a class="card-link" href="${n.url}" target="_blank">${t.readMore}</a></div></div>`;
    });
  });
  document.getElementById('grid').innerHTML=html;
}
setLang('pt');
</script>
</body>
</html>
