name: Atualizar Radar HVACR

# Toda segunda o Claude grava o HTML do radar no Cloudflare D1 (tarefa agendada ~08:01 BRT).
# Este workflow busca esse HTML e atualiza o index.html do repositório.
# Roda duas vezes (11:00 e 17:00 BRT) como margem caso a tarefa atrase; se nada mudou, não faz commit.
on:
  schedule:
    - cron: "0 14 * * 1"
    - cron: "0 20 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-radar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Buscar HTML no Cloudflare D1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          D1_DATABASE_ID: cec34320-05ca-4114-8f16-df62ac942cec
        run: |
          set -euo pipefail
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/d1/database/${D1_DATABASE_ID}/query" \
            -d '{"sql":"SELECT html, updated_at FROM radar WHERE id = 1"}' \
            -o "$RUNNER_TEMP/resp.json"

          jq -e '.success == true' "$RUNNER_TEMP/resp.json" > /dev/null
          jq -j '.result[0].results[0].html // ""' "$RUNNER_TEMP/resp.json" > "$RUNNER_TEMP/new.html"
          UPDATED_AT=$(jq -r '.result[0].results[0].updated_at // "desconhecida"' "$RUNNER_TEMP/resp.json")
          echo "UPDATED_AT=${UPDATED_AT}" >> "$GITHUB_ENV"

          # Trava de segurança: não publica HTML vazio, truncado ou quebrado.
          SIZE=$(wc -c < "$RUNNER_TEMP/new.html")
          if [ "$SIZE" -lt 5000 ]; then echo "HTML muito pequeno (${SIZE} bytes) - abortando"; exit 1; fi
          head -c 15 "$RUNNER_TEMP/new.html" | grep -q '<!DOCTYPE html>' || { echo "HTML sem DOCTYPE - abortando"; exit 1; }
          grep -q '</html>' "$RUNNER_TEMP/new.html" || { echo "HTML sem </html> - abortando"; exit 1; }

          cp "$RUNNER_TEMP/new.html" index.html

      - name: Commit se houver mudança
        id: commit
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo "Sem mudanças no radar."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Radar semanal - ${UPDATED_AT}"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Solicitar rebuild do GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
